name: Apply V715 Customer Role Workspaces

on:
  push:
    branches:
      - v715-customer-role-workspaces-stage
    paths:
      - .v715/chunk-007.b64

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v715-customer-role-workspaces-stage

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Rebuild and apply V715 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v715/chunk-*.b64 | base64 -d | gzip -d > /tmp/v715.patch
          git apply --check /tmp/v715.patch
          git apply /tmp/v715.patch

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print0)

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find backend frontend -type f -name '*.php' -print0)

      - name: Commit verified V715
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v715
          rm -f .github/workflows/apply-v715-stage.yml
          git config user.name 'BELM V715 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'V715 customer company role workspaces'
          git push origin HEAD:v715-customer-role-workspaces-stage
