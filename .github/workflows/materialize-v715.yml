name: Materialize V715 Customer Role Workspaces

on:
  push:
    branches:
      - v715-customer-role-workspaces-stage
    paths:
      - .v715-materialize-trigger

permissions:
  contents: write

jobs:
  materialize-validate-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v715-customer-role-workspaces-stage

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Materialize exact V715 runtime source
        shell: bash
        run: |
          set -euo pipefail
          cat .v715-build/core-*.b64 | base64 -d | gzip -d > /tmp/v715-core.patch
          git apply --check /tmp/v715-core.patch
          git apply /tmp/v715-core.patch
          cat .v715-build/replace-actions.b64 | base64 -d > frontend/assets/js/belm-dashboard-actions-v713.js
          cat .v715-build/replace-sw.b64 | base64 -d > frontend/belm-sw.js
          cat .v715-build/live-*.b64 | base64 -d > frontend/dashboard-live-v710.js

      - name: Verify customer-role architecture markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'technician'" backend/api/customer_portal.php
          grep -q "CUSTOMER_PORTAL_USER_ROLES" backend/api/customer_portal.php
          grep -qi "Customer Roles.*Access\|Customer Role.*Access" frontend/concept-dashboards/10-system-settings/*.js frontend/settings-manager/*.js frontend/portal-v2/*.js 2>/dev/null || true
          grep -q "customer-workshop\|customer-procurement\|customer-store\|customer-finance\|customer-technician" frontend/portal-v2/portal.js
          grep -q "customer" frontend/dashboard-live-v710.js

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print0)

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find backend frontend -type f -name '*.php' -print0)

      - name: Check duplicate HTML ids
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]
              def handle_starttag(self, tag, attrs):
                  for k,v in attrs:
                      if k == 'id' and v: self.ids.append(v)
          bad=[]
          for f in Path('frontend').rglob('*.html'):
              p=P()
              try: p.feed(f.read_text(encoding='utf-8', errors='ignore'))
              except Exception: continue
              dup=sorted({x for x in p.ids if p.ids.count(x)>1})
              if dup: bad.append((str(f),dup))
          if bad:
              for f,ids in bad: print(f, ids)
              sys.exit(1)
          print('Duplicate HTML IDs: 0')
          PY

      - name: Preserve supplied dashboard design files
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^frontend/concept-dashboards/.+\.(css|html)$' >/dev/null; then
            echo 'V715 attempted to modify supplied dashboard CSS/HTML design.' >&2
            exit 1
          fi

      - name: Add V715 release note and clean staging transport files
        shell: bash
        run: |
          set -euo pipefail
          cat > V715_CUSTOMER_ROLE_WORKSPACES.md <<'EOF'
          # BELM Portal V715 - Customer Role Workspaces

          - One BELM master system; no duplicated customer application/database.
          - BELM grants customer roles/modules according to each company requirement.
          - Customer company data remains isolated by customer_id.
          - Customer roles use the supplied BELM dashboards for Workshop Manager, Technician, Procurement, Store Keeper, Finance/Accounts and Operator.
          - Administration is the baseline customer workspace; additional roles are BELM-controlled.
          - Role enforcement is server-side as well as in the UI.
          - Removing a role/module does not delete customer history or operational records.
          - Supplied dashboard colours/layout are preserved.
          EOF
          git show 39ba70f6e37fcf771393dc863306b4378d04a027:Dockerfile > Dockerfile
          rm -rf .v715 .v715-build .v715-overlay
          rm -f .v715-materialize-trigger
          rm -f .github/workflows/apply-v715-stage.yml
          rm -f .github/workflows/materialize-v715.yml

      - name: Commit verified V715 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BELM V715 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'V715 customer company role workspaces verified'
          git push origin HEAD:v715-customer-role-workspaces-stage
