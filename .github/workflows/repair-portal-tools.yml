name: Apply BELM release bundle

on:
  push:
    branches: [main]
    paths:
      - 'belm-release-v9.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed BELM release
        shell: bash
        run: |
          set -euo pipefail
          test -f belm-release-v9.patch
          git apply --check --binary belm-release-v9.patch
          git apply --binary belm-release-v9.patch
          rm -f belm-release-v9.patch

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print0)

      - name: Commit reviewed release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BELM Portal Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Unify role sidebars and prevent duplicate records'
          git push origin HEAD:main
