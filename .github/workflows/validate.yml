name: Validate portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find backend -type f -name '*.php' -print0)

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print0)

      - name: Validate account credential routes
        run: node tests/account-credentials-route.test.js

      - name: Validate login detail editing
        run: node tests/login-detail-edit.test.js

      - name: Validate dynamically loaded modules
        run: node tests/dynamic-script-readiness.test.js

      - name: Validate reports API routing
        run: node tests/reports-route.test.js

      - name: Validate local HTML static assets
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          root = 'frontend'
          pattern = re.compile(r'(?:src|href)=["\'](/[^"\'#?]+(?:\.js|\.css))["\']', re.I)
          missing = []
          for dirpath, _, files in os.walk(root):
              for name in files:
                  if not name.endswith('.html'):
                      continue
                  path = os.path.join(dirpath, name)
                  with open(path, encoding='utf-8') as handle:
                      text = handle.read()
                  for ref in pattern.findall(text):
                      target = os.path.join(root, ref.lstrip('/'))
                      if not os.path.isfile(target):
                          missing.append((path, ref))
          if missing:
              for path, ref in sorted(set(missing)):
                  print(f'Missing static asset: {path} -> {ref}')
              sys.exit(1)
          print('All local HTML JS/CSS assets resolve.')
          PY

      - name: Validate dynamic frontend assets
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          root = 'frontend'
          pattern = re.compile(r'''["'`](/[^"'`?#]+\.(?:js|css))(?:[?#][^"'`]*)?["'`]''', re.I)
          missing = []
          for dirpath, _, files in os.walk(root):
              for name in files:
                  if not (name.endswith('.html') or name.endswith('.js')):
                      continue
                  path = os.path.join(dirpath, name)
                  with open(path, encoding='utf-8', errors='ignore') as handle:
                      text = handle.read()
                  for ref in pattern.findall(text):
                      target = os.path.join(root, ref.lstrip('/'))
                      if not os.path.isfile(target):
                          missing.append((path, ref))
          if missing:
              for path, ref in sorted(set(missing)):
                  print(f'Missing dynamic asset: {path} -> {ref}')
              sys.exit(1)
          print('All quoted local JS/CSS assets resolve.')
          PY

      - name: Validate canonical frontend API routes
        shell: bash
        run: |
          python3 - <<'PY'
          import os, sys
          forbidden = {
              '/api/customer_mode.php',
              '/api/customer_notification_test.php',
              '/api/workshop_material_requests.php',
              '/api/checklist_reports.php',
              '/api/customer_settings.php',
              '/api/customer_checkup.php',
          }
          hits = []
          for dirpath, _, files in os.walk('frontend'):
              for name in files:
                  if not (name.endswith('.html') or name.endswith('.js')):
                      continue
                  path = os.path.join(dirpath, name)
                  with open(path, encoding='utf-8', errors='ignore') as handle:
                      text = handle.read()
                  for route in forbidden:
                      if route in text:
                          hits.append((path, route))
          if hits:
              for path, route in sorted(set(hits)):
                  print(f'Legacy API route: {path} -> {route}')
              sys.exit(1)
          print('Canonical frontend API routes validated.')
          PY

      - name: Validate machine-card performance guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          display = Path('frontend/customers-manager/machine-display-v641.js').read_text(encoding='utf-8')
          machines = Path('frontend/concept-dashboards/11-workshop-manager/machines.html').read_text(encoding='utf-8')
          engineering = Path('backend/api/engineering.php').read_text(encoding='utf-8')
          password = Path('frontend/password-visibility.js').read_text(encoding='utf-8')

          required = [
              ('machine-display singleton', 'window.__belmMachineDisplayV641Booted' in display),
              ('idempotent display renderer', 'belmDisplayKey' in display),
              ('observer self-mutation filter', "closest?.('.belm-machine-display')" in display),
              ('compact dispatch frontend', 'compact=1&machineId=' in display),
              ('compact dispatch backend', '$compactDispatch' in engineering),
              ('iframe duplicate-script guard', 'script[data-machine-display],script[data-belm-machine-display-v641]' in machines),
              ('cache-busted machine display', 'v=819-loading-performance' in password),
          ]
          failed = [name for name, ok in required if not ok]
          if failed:
              print('Missing performance guard(s): ' + ', '.join(failed))
              sys.exit(1)
          if "const observer=new MutationObserver(()=>requestAnimationFrame(scan));" in display:
              print('Legacy unbounded machine-card MutationObserver loop found.')
              sys.exit(1)
          print('Machine-card loading/performance guards validated.')
          PY

      - name: Validate deployment support files
        shell: bash
        run: |
          set -euo pipefail
          sh -n docker/start-render.sh
          (cd backend/templates && sha256sum -c MASTER_TEMPLATES.sha256)
