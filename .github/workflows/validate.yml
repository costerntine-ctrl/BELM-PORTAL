name: Validate portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find backend -type f -name '*.php' -print0)

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print0)

      - name: Validate local HTML static assets
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          root = 'frontend'
          pattern = re.compile(r'(?:src|href)=["\'](/[^"\'#?]+(?:\.js|\.css))["\']', re.I)
          missing = []
          for dirpath, _, files in os.walk(root):
              for name in files:
                  if not name.endswith('.html'):
                      continue
                  path = os.path.join(dirpath, name)
                  with open(path, encoding='utf-8') as handle:
                      text = handle.read()
                  for ref in pattern.findall(text):
                      target = os.path.join(root, ref.lstrip('/'))
                      if not os.path.isfile(target):
                          missing.append((path, ref))
          if missing:
              for path, ref in sorted(set(missing)):
                  print(f'Missing static asset: {path} -> {ref}')
              sys.exit(1)
          print('All local HTML JS/CSS assets resolve.')
          PY
