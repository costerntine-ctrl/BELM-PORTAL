<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex portal-home.html index.html

    RewriteEngine On

    # Main Menu was retired; old bookmarks now open All Overview.
    RewriteRule ^admin-menu/?$ /overview-manager/ [R=302,L]

    # V208 friendly app entry links.
    RewriteRule ^app(?:/[a-zA-Z0-9@-]+)?/?$ /customer-app.html [END]

    # These role login addresses are React routes, not physical folders.
    # Route them internally to the compiled app while preserving query strings
    # such as /portal/login?customer=company-name.
    RewriteRule ^(?:admin/login|portal/login|tech)(?:/.*)?$ /index.html [END]

    # Server-level SPA fallback. This keeps React routing operational even when
    # a deployment/upload does not preserve the frontend .htaccess file.
    RewriteCond %{REQUEST_URI} !^/api(?:/|$)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [END]
</Directory>

<Directory /var/www/html/api>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    FallbackResource /api/index.php
</Directory>

ServerName 0.0.0.0
ServerTokens Prod
ServerSignature Off

# Allow the main BELM website app wrapper, but block unrelated sites from framing the portal.
Header always set Content-Security-Policy "frame-ancestors 'self' https://belmgeneraltech.co.tz https://www.belmgeneraltech.co.tz"
