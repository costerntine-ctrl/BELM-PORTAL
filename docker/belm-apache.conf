<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex portal-home.html index.html
    FallbackResource /index.html
</Directory>

<Directory /var/www/html/login>
    DirectoryIndex index.html
    FallbackResource disabled
</Directory>

<Directory /var/www/html/apply>
    DirectoryIndex index.html
    FallbackResource disabled
</Directory>

<Directory /var/www/html/forgot-password>
    DirectoryIndex index.html
    FallbackResource disabled
</Directory>

<Directory /var/www/html/api>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    FallbackResource /api/index.php
</Directory>

ServerName 0.0.0.0
ServerTokens Prod
ServerSignature Off
