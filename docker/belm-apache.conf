<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex portal-home.html index.html
    FallbackResource /index.html
</Directory>

<Directory /var/www/html/api>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    FallbackResource /api/index.php
</Directory>

# Some Apache setups strip the Authorization header before it reaches PHP.
# Without it, every logged-in API call looks unauthenticated, so the admin
# console keeps bouncing back to the login screen right after a real,
# successful login. Force it through explicitly.
CGIPassAuth On

ServerName 0.0.0.0
ServerTokens Prod
ServerSignature Off
