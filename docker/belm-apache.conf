<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/api>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    FallbackResource /api/index.php
</Directory>

# Some Apache setups strip the Authorization header before it reaches PHP,
# which makes every logged-in API call look unauthenticated. Force it through.
CGIPassAuth On

ServerName 0.0.0.0
ServerTokens Prod
ServerSignature Off
