<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex portal-home.html index.html

    RewriteEngine On

    # Main Menu was retired; old bookmarks now open All Overview.
    RewriteRule ^admin-menu/?$ /overview-manager/ [R=302,L]

    # V303 canonical login: every email/password account enters here.
    RewriteRule ^login/?$ /customer-app.html [END]

    # Legacy friendly/customer/role login bookmarks remain valid but converge
    # on the single canonical login URL. Query strings are intentionally kept.
    RewriteRule ^app(?:/[a-zA-Z0-9@-]+)?/?$ /login [R=302,L]
    RewriteRule ^(?:admin/login|portal/login)/?$ /login [R=302,L]

    # /tech is the authenticated Technician workspace, not the login page.
    RewriteRule ^tech(?:/.*)?$ /index.html [END]

    # Server-level SPA fallback. This keeps React routing operational even when
    # a deployment/upload does not preserve the frontend .htaccess file.
    RewriteCond %{REQUEST_URI} !^/api(?:/|$)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [END]
</Directory>

<Directory /var/www/html/api>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    FallbackResource /api/index.php
</Directory>

ServerName 0.0.0.0
ServerTokens Prod
ServerSignature Off

# Allow the main BELM website app wrapper, but block unrelated sites from framing the portal.
Header always set Content-Security-Policy "frame-ancestors 'self' https://belmgeneraltech.co.tz https://www.belmgeneraltech.co.tz"
