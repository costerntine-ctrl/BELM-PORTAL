<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex portal-home.html index.html

    RewriteEngine On
    # There is one login UI only. These old React routes are redirected before
    # the legacy bundle can display its separate Admin or Customer login form.
    RewriteRule ^admin/login/?$ /login/?role=admin [R=302,L,NE]
    RewriteRule ^portal/login/?$ /login/ [R=302,L,NE]

    FallbackResource /index.html
</Directory>

<Directory /var/www/html/login>
    DirectoryIndex index.html
    FallbackResource disabled
</Directory>

<Directory /var/www/html/apply>
    DirectoryIndex index.html
    FallbackResource disabled
</Directory>

<Directory /var/www/html/forgot-password>
    DirectoryIndex index.html
    FallbackResource disabled
</Directory>

<Directory /var/www/html/api>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    FallbackResource /api/index.php
</Directory>

ServerName 0.0.0.0
ServerTokens Prod
ServerSignature Off
