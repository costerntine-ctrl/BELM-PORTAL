<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex portal-home.html index.html

    # Route any URL that isn't a real file/folder to the app shell, so
    # virtual routes like /tech, /portal/login, /admin/overview work even
    # if a hidden .htaccess file never made it into the deployed repo
    # (a very common mistake: file managers hide dotfiles by default when
    # dragging extracted files into GitHub).
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^api(?:/|$) - [L]
        RewriteRule ^portal-home\.html$ - [L]
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </IfModule>
</Directory>

<Directory /var/www/html/api>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    FallbackResource /api/index.php

    # Some Apache setups strip the Authorization header before it reaches
    # PHP, which makes every logged-in API call look unauthenticated.
    CGIPassAuth On

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /api/
        RewriteCond %{HTTP:Authorization} ^(.*)
        RewriteRule ^ - [E=HTTP_AUTHORIZATION:%1]
        RewriteRule ^(?:config|scripts)(?:/|$) - [F,L,NC]
        RewriteRule ^(?:schema|repair_admin)\.sql$ - [F,L,NC]
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </IfModule>
</Directory>

<Directory /var/www/html/api/config>
    Require all denied
</Directory>

ServerName 0.0.0.0
ServerTokens Prod
ServerSignature Off
