; Raises PHP's default request-size limits so features that submit
; base64-encoded files in the JSON body (email attachments, checklist
; evidence photos, receipt uploads) don't get silently rejected by
; php.ini defaults (commonly post_max_size=8M) before our own,
; more specific size checks in the application code ever run.
post_max_size = 24M
upload_max_filesize = 20M
memory_limit = 256M
max_execution_time = 60
