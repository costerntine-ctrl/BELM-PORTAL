<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="cache-control" content="no-store">
  <title>BELM Operations Portal — Redirecting</title>
  <script>
  (function(){
    var q=new URLSearchParams(location.search);
    var hash=String(location.hash||'').replace(/^#/,'').toLowerCase();
    var target='/concept-dashboards/11-workshop-manager/';
    if(hash==='job-cards'||q.get('module')==='workshop') target='/concept-dashboards/11-workshop-manager/job-cards.html';
    else if(hash==='manage-technicians') target='/concept-dashboards/11-workshop-manager/technicians.html';
    else if(hash==='assigned-work') target='/concept-dashboards/11-workshop-manager/workshop-schedule.html';
    else if(hash==='tool-issue-documents') target='/concept-dashboards/11-workshop-manager/tools-equipment.html';
    else if(hash==='procurement') target='/concept-dashboards/03-procurement/';
    var out=new URL(target,location.origin);
    q.forEach(function(v,k){ if(k!=='embed'&&k!=='from'&&!out.searchParams.has(k)) out.searchParams.set(k,v); });
    location.replace(out.pathname+out.search+out.hash);
  })();
  </script>
</head>
<body><p>Opening the current BELM dashboard…</p></body>
</html>
