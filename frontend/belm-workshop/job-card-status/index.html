<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BELM Workshop Job Card Status</title>
<style>
:root{font-family:Arial,Calibri,sans-serif;color:#17243a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17243a}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dfe5ee;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand b{display:block;color:#1d57a7;font-size:20px}.brand span{font-size:12px;color:#66758a;font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #cbd5e3;background:#fff;color:#20314d;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}.btn.primary{background:#1f5fb7;color:#fff;border-color:#1f5fb7}.wrap{max-width:1400px;margin:0 auto;padding:24px}.hero{background:linear-gradient(110deg,#12345f,#1f68b5);color:#fff;border-radius:16px;padding:22px 24px;box-shadow:0 10px 26px rgba(18,52,95,.13)}.hero h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;color:#dbeaff;font-weight:600}.summary{display:flex;gap:12px;align-items:center;margin:18px 0}.count{font-size:28px;font-weight:900;color:#1f5fb7}.summary small{color:#68778b;font-weight:700}.toolbar{display:flex;gap:10px;margin:14px 0}.search{flex:1;min-width:220px;border:1px solid #ccd6e3;border-radius:10px;padding:12px 14px;font-size:15px;background:#fff}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:16px;box-shadow:0 4px 14px rgba(21,44,76,.05);cursor:pointer}.card:hover{border-color:#8fb5e5;box-shadow:0 8px 20px rgba(21,44,76,.09)}.row1{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.jc{font-size:17px;font-weight:900;color:#174f96}.machine{font-size:19px;font-weight:900;margin:4px 0}.muted{color:#718096;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:9px;margin-top:13px}.cell{background:#f6f8fb;border-radius:9px;padding:9px 10px}.cell span{display:block;color:#738196;font-size:11px;font-weight:800;text-transform:uppercase}.cell b{display:block;margin-top:4px;font-size:13px}.issue{margin-top:12px;padding:11px 12px;background:#f8fafc;border-left:4px solid #1f5fb7;border-radius:8px;font-weight:700}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;text-transform:uppercase}.pill.progress{background:#dff4e6;color:#16713c}.pill.waiting{background:#fff1cf;color:#9a6500}.pill.completed{background:#e4eefc;color:#17549c}.empty,.loading{padding:36px;text-align:center;background:#fff;border:1px dashed #cbd6e3;border-radius:14px;color:#68778b;font-weight:800}.detail{position:fixed;inset:0;background:rgba(8,19,34,.55);z-index:10;display:none;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto}.detail.open{display:flex}.sheet{width:min(900px,100%);background:#fff;border-radius:16px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.2)}.sheet-head{display:flex;justify-content:space-between;gap:12px}.sheet h2{margin:0 0 5px}.close{border:0;background:#eef2f7;border-radius:8px;width:38px;height:38px;font-size:20px;cursor:pointer}.section{margin-top:16px;border-top:1px solid #e4e9f0;padding-top:14px}.section h3{margin:0 0 10px;color:#1d57a7}.report{background:#f7f9fc;border:1px solid #e0e7f0;border-radius:10px;padding:11px 12px;margin:8px 0}.report b{display:block;margin-bottom:4px}.spare{background:#fff8e8;border:1px solid #f3d897;border-radius:10px;padding:11px 12px;margin:8px 0}.footer-note{margin:22px 0 4px;color:#77859a;font-size:12px;text-align:center}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.wrap{padding:14px}.hero h1{font-size:22px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.row1{display:block}.pill{margin-top:8px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>BELM OPERATIONS PORTAL</b><span>Workshop Manager · Live Job Card Status</span></div><div class="actions"><a class="btn" href="/concept-dashboards/11-workshop-manager/">← Workshop Dashboard</a><button id="refresh" class="btn primary" type="button">↻ Sync / Refresh</button></div></header>
<main class="wrap"><section class="hero"><h1 id="pageTitle">Job Cards</h1><p id="pageNote">Live synchronized Job Card information.</p></section><div class="summary"><span id="count" class="count">0</span><small id="countLabel">records</small></div><div class="toolbar"><input id="search" class="search" type="search" placeholder="Search Job Card, machine, customer, technician or issue..."></div><section id="list" class="list"><div class="loading">Loading live Job Cards…</div></section><div class="footer-note">One Job Card record is shared across Workshop Manager, Technician, Store / Procurement and reports.</div></main>
<div id="detail" class="detail" role="dialog" aria-modal="true"><div class="sheet"><div class="sheet-head"><div><h2 id="detailTitle">Job Card</h2><div id="detailSub" class="muted"></div></div><button id="close" class="close" type="button">×</button></div><div id="detailBody"></div></div></div>
<script>
(function(){
'use strict';
const token=localStorage.getItem('belm_admin_token')||'';
if(!token){location.replace('/login');return;}
const qs=new URLSearchParams(location.search);const mode=String(qs.get('status')||'progress').toLowerCase();let all=[],visible=[];
const config={
 progress:{title:'In Progress Job Cards',note:'Job Cards being worked on now. Open a record to see Technician diagnosis, work done and progress reports.',label:'active Job Cards',pill:'progress',pillText:'In Progress'},
 waiting:{title:'Waiting for Spare',note:'Live list of machines / Job Cards currently waiting for spare parts or spare-related action.',label:'machines waiting for spare',pill:'waiting',pillText:'Waiting for Spare'},
 completed:{title:'Completed Job Cards',note:'Completed Job Card list synchronized from the same Workshop records.',label:'completed Job Cards',pill:'completed',pillText:'Completed'}
};
const cfg=config[mode]||config.progress;document.getElementById('pageTitle').textContent=cfg.title;document.getElementById('pageNote').textContent=cfg.note;document.title='BELM · '+cfg.title;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fmt(v){if(!v)return '—';const d=new Date(String(v).replace(' ','T'));return Number.isNaN(d.getTime())?String(v):d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function jobStatus(c){return String(c.jobStatus??c.job_status??'').toUpperCase()}
function caseStatus(c){return String(c.status??'').toUpperCase()}
function stage(c){return String(c.stage??'').toUpperCase()}
function isWaiting(c){return jobStatus(c)==='WAITING_FOR_PARTS'||['BOSS_APPROVAL','STORE_CHECK','PROCUREMENT','ACCOUNTS'].includes(stage(c))||Boolean(c.waitingForSpare||c.waiting_for_spare)}
function isCompleted(c){return caseStatus(c)==='COMPLETED'||jobStatus(c)==='COMPLETED'}
function isProgress(c){return !isCompleted(c)&&!isWaiting(c)&&(jobStatus(c)==='IN_PROGRESS'||['DIAGNOSIS','REPAIR','TESTING'].includes(stage(c)))}
function match(c){return mode==='waiting'?isWaiting(c):mode==='completed'?isCompleted(c):isProgress(c)}
async function api(path){const r=await fetch('/api/breakdown-workflow'+path,{cache:'no-store',headers:{Authorization:'Bearer '+token}});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(_){}if(!r.ok)throw new Error(d&&d.error||('Request failed ('+r.status+')'));return d}
function render(){const q=document.getElementById('search').value.toLowerCase().trim();visible=all.filter(match).filter(c=>!q||[c.jobCardNo,c.job_card_no,c.machineLabel,c.fleetNumber,c.customerName,c.technicianName,c.description,c.title,c.stage,c.jobStatus].join(' ').toLowerCase().includes(q));visible.sort((a,b)=>(Date.parse(b.updatedAt||b.openedAt||b.createdAt||'')||0)-(Date.parse(a.updatedAt||a.openedAt||a.createdAt||'')||0));document.getElementById('count').textContent=visible.length;document.getElementById('countLabel').textContent=cfg.label;const list=document.getElementById('list');if(!visible.length){list.innerHTML='<div class="empty">No '+esc(cfg.label)+' found.</div>';return}list.innerHTML=visible.map(c=>`<article class="card" data-id="${esc(c.id)}"><div class="row1"><div><div class="jc">${esc(c.jobCardNo||c.job_card_no||'Job Card')}</div><div class="machine">${esc(c.machineLabel||'Machine')}${c.fleetNumber?' · '+esc(c.fleetNumber):''}</div><div class="muted">${esc(c.customerName||'Customer')}</div></div><span class="pill ${cfg.pill}">${esc(cfg.pillText)}</span></div><div class="grid"><div class="cell"><span>Technician</span><b>${esc(c.technicianName||'Unassigned')}</b></div><div class="cell"><span>Current Stage</span><b>${esc((c.stage||c.jobStatus||'—').replaceAll('_',' '))}</b></div><div class="cell"><span>Department</span><b>${esc(c.department||'Workshop')}</b></div><div class="cell"><span>Updated</span><b>${esc(fmt(c.updatedAt||c.openedAt||c.createdAt))}</b></div></div><div class="issue">${esc(c.description||c.title||'No issue description recorded.')}</div></article>`).join('');document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>openDetail(el.dataset.id)))}
async function openDetail(id){const dlg=document.getElementById('detail');dlg.classList.add('open');document.getElementById('detailTitle').textContent='Loading Job Card…';document.getElementById('detailSub').textContent='';document.getElementById('detailBody').innerHTML='<div class="loading">Synchronizing record…</div>';try{const d=await api('/case/'+encodeURIComponent(id));const c=d.case||{};const jobs=Array.isArray(d.jobCards)?d.jobCards:[];const spares=Array.isArray(d.spares)?d.spares:[];const events=Array.isArray(d.events)?d.events:[];const main=jobs.find(j=>!['CANCELLED'].includes(String(j.status||'').toUpperCase()))||jobs[0]||{};document.getElementById('detailTitle').textContent=main.job_card_no||main.jobCardNo||c.jobCardNo||'Job Card';document.getElementById('detailSub').textContent=[c.machineLabel,c.customerName,c.technicianName].filter(Boolean).join(' · ');let html=`<div class="section"><h3>Job Card Information</h3><div class="grid"><div class="cell"><span>Status</span><b>${esc(String(main.status||c.jobStatus||c.status||'—').replaceAll('_',' '))}</b></div><div class="cell"><span>Technician</span><b>${esc(main.technician_name||main.technicianName||c.technicianName||'Unassigned')}</b></div><div class="cell"><span>Started</span><b>${esc(fmt(main.started_at||main.startedAt||c.openedAt))}</b></div><div class="cell"><span>Completed</span><b>${esc(fmt(main.completed_at||main.completedAt))}</b></div></div></div>`;
if(mode==='progress'){html+=`<div class="section"><h3>Technician Report</h3><div class="report"><b>Diagnosis</b>${esc(main.diagnosis||'Not reported yet.')}</div><div class="report"><b>Work Done / Progress</b>${esc(main.work_done||main.workDone||'No progress report yet.')}</div><div class="report"><b>Test Result</b>${esc(main.test_result||main.testResult||'Not recorded yet.')}</div>${events.filter(e=>/TECH|DIAGNOS|PROGRESS|REPAIR|TEST/i.test([e.department,e.action,e.note].join(' '))).slice(-8).reverse().map(e=>`<div class="report"><b>${esc(e.action||'Technician update')}</b>${esc(e.note||'')}<div class="muted">${esc(e.actor_name||e.actorName||'Technician')} · ${esc(fmt(e.created_at||e.createdAt))}</div></div>`).join('')}</div>`}
if(mode==='waiting'){html+=`<div class="section"><h3>Spare / Parts Status</h3>${spares.length?spares.map(s=>`<div class="spare"><b>${esc(s.spareName||s.spare_name||'Spare')} × ${esc(s.quantity||1)} ${esc(s.unit||'pcs')}</b><div>${esc((s.status||'WAITING').replaceAll('_',' '))}</div><div class="muted">Part No: ${esc(s.partNumber||s.part_number||'—')} · Requested ${esc(fmt(s.requestedAt||s.requested_at))}</div></div>`).join(''):'<div class="empty">This Job Card is in a spare-related stage, but no spare line is available in the current detail response.</div>'}</div>`}
if(mode==='completed'){html+=`<div class="section"><h3>Completion Report</h3><div class="report"><b>Diagnosis</b>${esc(main.diagnosis||'—')}</div><div class="report"><b>Work Done</b>${esc(main.work_done||main.workDone||'—')}</div><div class="report"><b>Test Result</b>${esc(main.test_result||main.testResult||'—')}</div><div class="report"><b>Completion Note</b>${esc(main.completion_note||main.completionNote||'—')}</div></div>`}
document.getElementById('detailBody').innerHTML=html}catch(e){document.getElementById('detailBody').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function load(){const list=document.getElementById('list');list.innerHTML='<div class="loading">Syncing live Job Cards…</div>';try{try{await api('/sync')}catch(_){}all=await api('');if(!Array.isArray(all))all=[];render()}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
document.getElementById('search').addEventListener('input',render);document.getElementById('refresh').addEventListener('click',load);document.getElementById('close').addEventListener('click',()=>document.getElementById('detail').classList.remove('open'));document.getElementById('detail').addEventListener('click',e=>{if(e.target.id==='detail')e.currentTarget.classList.remove('open')});load();
})();
</script>
</body>
</html>
