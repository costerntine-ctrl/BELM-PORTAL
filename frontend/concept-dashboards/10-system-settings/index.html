<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="cache-control" content="no-store">
  <title>System Settings — BELM Operations Portal</title>
</head>
<body>
  <script>
    (function () {
      var hash = window.location.hash || '';
      var hashMap = {
        '#system-information': '#system-configuration'
      };
      var targetHash = hashMap[hash] || hash;
      window.location.replace('/settings-manager/' + targetHash);
    })();
  </script>
  <noscript><a href="/settings-manager/">Open System Settings</a></noscript>
</body>
</html>
