<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BELM Workshop Manager — Job Cards</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071526}
    #workflowFrame{display:block;width:100%;height:100%;border:0;background:#071526}
  </style>
</head>
<body>
<script>
(function(){
  var incoming=new URLSearchParams(window.location.search);
  var status=String(incoming.get('status')||'').trim().toLowerCase().replace(/[_\s]+/g,'-');

  // V718: In Progress opens the live Main Job Card Process directly, without
  // showing the older Workshop landing page first. The workflow remains the
  // same canonical record/process used by BELM Workshop and Technicians.
  if(status==='progress'||status==='in-progress'){
    var frame=document.createElement('iframe');
    frame.id='workflowFrame';
    frame.title='BELM Main Job Card Process';
    frame.src='/breakdown-workflow/?actor=admin&embed=1&view=job-cards&status=progress';
    document.body.appendChild(frame);
    return;
  }

  var target='/belm-workshop/#job-cards';
  var out=new URL(target,window.location.origin);
  incoming.forEach(function(value,key){if(!out.searchParams.has(key))out.searchParams.set(key,value);});
  window.location.replace(out.pathname+out.search+out.hash);
})();
</script>
</body>
</html>
