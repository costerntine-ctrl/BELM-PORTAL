  <title>BELM Workshop Manager — Job Cards</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#071526;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}.loading{font-size:13px;color:#9db1c4}</style>

<body>
  <div class="loading">Opening BELM Workshop &amp; Job Cards…</div>
<script>
(function(){
  if(!localStorage.getItem('belm_admin_token')){location.replace('/login');return;}
  var incoming=new URLSearchParams(location.search);
  var out=new URL('/breakdown-workflow/',location.origin);
  out.searchParams.set('actor','admin');
  out.searchParams.set('view','job-cards');
  out.searchParams.set('module','workshop');
  incoming.forEach(function(v,k){
    if(k==='actor'||k==='embed'||k==='view'||k==='module')return;
    out.searchParams.set(k,v);
  });
  location.replace(out.pathname+out.search);
})();
</script>
</body></html>
