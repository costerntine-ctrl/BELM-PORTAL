<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine Check Up — PORTAL-CWM</title><link rel="stylesheet" href="/theme-global.css?v=485-display-fit"><script src="/theme-manager.js?v=485-display-fit"></script><style>*{box-sizing:border-box}body{margin:0;background:#071a2d;color:#eef5ff;font-family:Inter,Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:#101d34;border-bottom:5px solid #ffd31a;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:800}.shell{max-width:820px;margin:auto;padding:18px}.hero,.card{background:#102037;border:1px solid #29435f;border-radius:16px;padding:17px;margin-bottom:14px}.eyebrow{color:#4ce39a;font-size:11px;font-weight:800;letter-spacing:.12em}.hero h1{margin:7px 0}.meta{color:#aab9cc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px}.field label,.item label{font-size:12px;font-weight:800;color:#b8c6d8}.field input,.field select,.item input,.item select,.item textarea{width:100%;padding:13px;border:1px solid #36516f;border-radius:11px;background:#0b192c;color:#fff;font:inherit}.items{display:grid;gap:11px}.item{background:#102037;border:1px solid #29435f;border-radius:14px;padding:15px}.item h3{font-size:15px;margin:0 0 5px}.item p{font-size:11px;color:#95a8be;margin:0 0 11px}.submit{width:100%;padding:15px;border:0;border-radius:12px;background:#18b866;color:#fff;font-weight:900;font-size:16px}.submit:disabled{opacity:.55}.alert{padding:13px;border-radius:11px;background:#4a1720;color:#ffdce2;margin-bottom:13px}.success{background:#103f2b;color:#caffdf}.hidden{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a href="/portal/dashboard?view=machines">← Machines</a><b>CHECK UP · CHECKLIST</b></header><main class="shell"><div id="alert" class="alert hidden"></div><section class="hero"><div class="eyebrow">TODAY'S MACHINE CHECK UP</div><h1 id="machineName">Loading…</h1><div id="machineMeta" class="meta"></div></section><form id="form"><section class="card"><div class="grid"><div class="field"><label>CHECKLIST TEMPLATE<select id="template" required></select></div><div class="field"><label>HOUR METER READING<input id="hours" type="number" min="0" step="0.1" required></label></div></div></section><section id="items" class="items"></section><section class="card"><button id="submit" class="submit" type="submit">✓ COMPLETE & SAVE CHECK UP</button></section></form></main><script>(function(){const token=localStorage.getItem('belm_customer_token')||'';const machineId=new URLSearchParams(location.search).get('machine')||'';const $=id=>document.getElementById(id);let data=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function alertMsg(m,ok=false){$('alert').textContent=m;$('alert').className='alert'+(ok?' success':'');$('alert').classList.toggle('hidden',!m)}async function api(opt={}){const r=await fetch('/api/api/customer_checkup.php'+(opt.method?'':'?machine='+encodeURIComponent(machineId)),{...opt,cache:'no-store',headers:{Authorization:'Bearer '+token,...(opt.body?{'Content-Type':'application/json'}:{})}});const t=await r.text();let d;try{d=JSON.parse(t)}catch(_){throw new Error('Could not load Check Up.')}if(!r.ok)throw new Error(d?.error||'Check Up request failed.');return d}function currentTemplate(){return data?.templates?.find(t=>String(t.id)===String($('template').value))}function control(item){const type=String(item.input_type||'TEXT').toUpperCase(),id=esc(item.id),req=item.isRequired?' required':'';if(type==='DROPDOWN'||type==='YES_NO'){let opts=Array.isArray(item.options)?item.options:[];if(type==='YES_NO'&&!opts.length)opts=['Yes','No'];return `<select data-answer="${id}"${req}><option value="">Select result</option>${opts.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`}if(type==='NUMBER')return `<input data-answer="${id}" type="number" step="any"${req}>`;if(type==='DATE')return `<input data-answer="${id}" type="date"${req}>`;if(type==='PHOTO')return `<input data-answer="${id}" type="file" accept="image/*" capture="environment"${req}>`;return `<textarea data-answer="${id}" rows="3"${req}></textarea>`}function render(){const t=currentTemplate();$('items').innerHTML=!t?'<section class="card">No checklist template available.</section>':(t.items||[]).map((x,i)=>`<article class="item"><h3>${i+1}. ${esc(x.label)}</h3><p>${esc(x.input_type)}${x.isRequired?' · Required':''}</p>${control(x)}</article>`).join('')}async function fileData(file){if(!file)return'';return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}async function load(){if(!token){location.replace('/login');return}if(!machineId){alertMsg('Machine is missing.');return}try{data=await api();const m=data.machine;$('machineName').textContent=[m.brand,m.model].filter(Boolean).join(' ')||m.machineType;$('machineMeta').textContent=[m.machineType,m.fleetNumber?'Fleet '+m.fleetNumber:'',m.serialNumber||m.regNumber||''].filter(Boolean).join(' · ');$('hours').value=data.latestHourMeter||0;$('template').innerHTML=(data.templates||[]).map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');if(data.todayReport){alertMsg('Today\'s Check Up is already completed. Status: '+(data.todayReport.overall_status||'CHECKED'),true);$('submit').disabled=true}render()}catch(e){alertMsg(e.message)}}$('template').onchange=render;$('form').onsubmit=async e=>{e.preventDefault();const t=currentTemplate();if(!t)return;try{$('submit').disabled=true;$('submit').textContent='Saving Check Up…';const answers=[];for(const item of t.items||[]){const el=document.querySelector(`[data-answer="${CSS.escape(String(item.id))}"]`);let value='',photoUrl='';if(String(item.input_type).toUpperCase()==='PHOTO'){photoUrl=await fileData(el.files?.[0])}else value=el.value;answers.push({itemId:item.id,value,photoUrl})}const out=await api({method:'POST',body:JSON.stringify({machineId,templateId:t.id,hourMeterReading:Number($('hours').value),answers})});alertMsg('Check Up completed. Machine status: '+out.overallStatus,true);$('submit').textContent='✓ CHECK UP SAVED';setTimeout(()=>location.href='/portal/dashboard?view=machines',900)}catch(err){alertMsg(err.message);$('submit').disabled=false;$('submit').textContent='✓ COMPLETE & SAVE CHECK UP'}};load()})();</script></body></html>
