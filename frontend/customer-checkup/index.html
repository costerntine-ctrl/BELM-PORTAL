<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine Check Up — PORTAL-CWM</title><link rel="stylesheet" href="/theme-global.css?v=485-display-fit"><script src="/theme-manager.js?v=485-display-fit"></script><style>*{box-sizing:border-box}body{margin:0;background:#071a2d;color:#eef5ff;font-family:Inter,Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:#101d34;border-bottom:5px solid #ffd31a;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:800}.shell{max-width:820px;margin:auto;padding:18px}.hero,.card{background:#102037;border:1px solid #29435f;border-radius:16px;padding:17px;margin-bottom:14px}.eyebrow{color:#4ce39a;font-size:11px;font-weight:800;letter-spacing:.12em}.hero h1{margin:7px 0}.meta{color:#aab9cc}.sync-note{margin-top:10px;font-size:11px;color:#8fb6d8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px}.field label,.item label{font-size:12px;font-weight:800;color:#b8c6d8}.field input,.field select,.item input,.item select,.item textarea{width:100%;padding:13px;border:1px solid #36516f;border-radius:11px;background:#0b192c;color:#fff;font:inherit}.default-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.default-box{background:#0b192c;border:1px solid #36516f;border-radius:12px;padding:12px}.default-box b{display:block;font-size:11px;color:#8fa4bb;margin-bottom:7px}.service-type{font-weight:900;color:#fff}.day-check{display:flex;align-items:center;gap:10px;font-weight:900}.day-check input{width:20px;height:20px;accent-color:#18b866}.display-photo{grid-column:1/-1}.display-photo input{width:100%}.photo-preview{display:none;margin-top:10px;max-height:180px;max-width:100%;border-radius:10px;border:1px solid #36516f}.edit-banner{margin-top:12px;padding:10px;border-radius:10px;background:#3f3211;color:#ffe487;font-size:12px;font-weight:800}.items{display:grid;gap:11px}.item{background:#102037;border:1px solid #29435f;border-radius:14px;padding:15px;transition:.18s ease}.item.safe{border-color:#187a50}.item.warn{border-color:#b88a16;background:#1b2735}.item.danger{border-color:#b93645;background:#261a29}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}.item h3{font-size:15px;margin:0}.item-meta{font-size:10px;color:#95a8be;margin-top:4px}.safety-pill{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;background:#21364d;color:#abc0d5;white-space:nowrap}.safety-pill.GREEN{background:#123d2b;color:#73e7a9}.safety-pill.YELLOW{background:#4c3b12;color:#ffd862}.safety-pill.RED{background:#4d1720;color:#ff98a3}.answer-wrap{display:grid;gap:9px}.answer-help{font-size:11px;color:#8fa4bb}.issue-note{display:none}.item.warn .issue-note,.item.danger .issue-note{display:grid}.submit{width:100%;padding:15px;border:0;border-radius:12px;background:#18b866;color:#fff;font-weight:900;font-size:16px}.submit:disabled{opacity:.55}.alert{padding:13px;border-radius:11px;background:#4a1720;color:#ffdce2;margin-bottom:13px}.success{background:#103f2b;color:#caffdf}.hidden{display:none!important}.no-template{padding:20px;text-align:center;color:#afbdd0}.photo-label{display:grid;gap:6px}@media(max-width:600px){.grid,.default-grid{grid-template-columns:1fr}.display-photo{grid-column:auto}.top{font-size:13px}.shell{padding:12px}.item{padding:13px}}</style></head><body><header class="top"><a href="/portal/dashboard?view=machines">← Machines</a><b>CHECK UP · CHECKLIST</b></header><main class="shell"><div id="alert" class="alert hidden"></div><section class="hero"><div class="eyebrow">TODAY'S MACHINE CHECK UP</div><h1 id="machineName">Loading…</h1><div id="machineMeta" class="meta"></div><div id="syncNote" class="sync-note">BELM master checklist sync</div><div id="editBanner" class="edit-banner hidden"></div></section><form id="form"><section class="card"><div class="default-grid"><div class="default-box display-photo"><b>DISPLAY PHOTO · REQUIRED</b><input id="displayPhoto" type="file" accept="image/*" capture="environment"><img id="photoPreview" class="photo-preview" alt="Machine display photo"></div><div class="default-box"><b>SERVICE TYPE</b><div id="serviceType" class="service-type">—</div></div><div class="default-box"><b>HRS METER</b><input id="hours" type="number" min="0" step="0.1" required></div><div class="default-box"><b>SERVICE DAY</b><label class="day-check"><input id="serviceDay" type="checkbox" required><span id="serviceDayLabel">Check ✓</span></label></div><div class="default-box"><b>CHECKLIST TEMPLATE</b><select id="template" required></select></div></div></section><section id="items" class="items"></section><section class="card"><button id="submit" class="submit" type="submit">✓ COMPLETE & SAVE CHECK UP</button></section></form></main><script>(function(){const token=localStorage.getItem('belm_customer_token')||'';const machineId=new URLSearchParams(location.search).get('machine')||'';const $=id=>document.getElementById(id);let data=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function alertMsg(m,ok=false){$('alert').textContent=m;$('alert').className='alert'+(ok?' success':'');$('alert').classList.toggle('hidden',!m)}async function api(opt={}){const r=await fetch('/api/api/customer_checkup.php'+(opt.method?'':'?machine='+encodeURIComponent(machineId)),{...opt,cache:'no-store',headers:{Authorization:'Bearer '+token,...(opt.body?{'Content-Type':'application/json'}:{})}});const t=await r.text();let d;try{d=JSON.parse(t)}catch(_){throw new Error('Could not load Check Up.')}if(!r.ok)throw new Error(d?.error||'Check Up request failed.');return d}function currentTemplate(){return data?.templates?.find(t=>String(t.id)===String($('template').value))}function inputType(item){return String(item.inputType||item.input_type||item.type||'TEXT').trim().toUpperCase()}function required(item){return item.isRequired===true||item.is_required===true||item.is_required===1||item.is_required==='1'}function options(item,type){let opts=Array.isArray(item.options)?item.options:[];if(!opts.length&&Array.isArray(item.dropdownOptions))opts=item.dropdownOptions.map(x=>typeof x==='object'?x.value:x);if(type==='YES_NO'&&!opts.length)opts=['YES','NO'];return opts.filter(x=>x!==null&&String(typeof x==='object'?x.value:x).trim()!=='').map(x=>typeof x==='object'?x.value:x)}function optionSafety(item,value){const map=item.optionSafety||item.option_safety||{};let s=map?.[value];if(!s&&Array.isArray(item.dropdownOptions)){const found=item.dropdownOptions.find(x=>String(x?.value)===String(value));s=found?.safetyLevel}if(!s&&inputType(item)==='YES_NO'){const v=String(value).toUpperCase();if(v==='YES')s=map.YES||'GREEN';if(v==='NO')s=map.NO||'RED'}return String(s||item.safetyLevel||item.safety_level||'GREEN').toUpperCase()}function control(item){const type=inputType(item),id=esc(item.id),req=required(item)?' required':'';if(type==='DROPDOWN'||type==='YES_NO'){const opts=options(item,type);return `<select data-answer="${id}"${req}><option value="">— Select result —</option>${opts.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`}if(type==='NUMBER')return `<input data-answer="${id}" type="number" step="any" inputmode="decimal"${req}>`;if(type==='DATE')return `<input data-answer="${id}" type="date"${req}>`;if(type==='PHOTO')return `<label class="photo-label"><span class="answer-help">Take / upload photo</span><input data-answer="${id}" type="file" accept="image/*" capture="environment"${req}></label>`;return `<input data-answer="${id}" type="text" placeholder="Enter result"${req}>`}function render(){const t=currentTemplate();$('serviceType').textContent=t?.service_type||t?.serviceType||'General Service';if(!t){$('items').innerHTML='<section class="card no-template">No active BELM checklist template is available for this machine.</section>';return}$('items').innerHTML=(t.items||[]).map((x,i)=>{const type=inputType(x),base=String(x.safetyLevel||x.safety_level||'GREEN').toUpperCase();return `<article class="item" data-item="${esc(x.id)}"><div class="item-head"><div><h3>${i+1}. ${esc(x.label)}</h3><div class="item-meta">${esc(type.replace('_',' / '))}${required(x)?' · Required':''}</div></div><span class="safety-pill ${esc(base)}" data-safety-pill>${esc(base==='NONE'?'INFO':base)}</span></div><div class="answer-wrap">${control(x)}<label class="issue-note">Issue / observation note<textarea data-note="${esc(x.id)}" rows="2" placeholder="Describe the problem found"></textarea></label></div></article>`}).join('');document.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('change',()=>updateSafety(el)));prefillToday()}function updateSafety(el){const t=currentTemplate(),item=t?.items?.find(x=>String(x.id)===String(el.dataset.answer));if(!item)return;const card=el.closest('.item'),type=inputType(item);let value=type==='PHOTO'?(el.files?.length?'PHOTO':''):el.value;let s=value?optionSafety(item,value):String(item.safetyLevel||item.safety_level||'GREEN').toUpperCase();card.classList.remove('safe','warn','danger');if(s==='GREEN')card.classList.add('safe');else if(s==='YELLOW')card.classList.add('warn');else if(s==='RED')card.classList.add('danger');const pill=card.querySelector('[data-safety-pill]');if(pill){pill.className='safety-pill '+s;pill.textContent=s==='NONE'?'INFO':s}}function prefillToday(){const r=data?.todayReport;if(!r)return;for(const a of r.answers||[]){const el=document.querySelector(`[data-answer="${CSS.escape(String(a.template_item_id))}"]`);const note=document.querySelector(`[data-note="${CSS.escape(String(a.template_item_id))}"]`);if(el&&el.type!=='file')el.value=a.value||'';if(note)note.value=a.note||'';if(el)updateSafety(el)}}async function fileData(file){if(!file)return'';return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}function showPhoto(src){if(!src)return;$('photoPreview').src=src;$('photoPreview').style.display='block'}async function load(){if(!token){location.replace('/login');return}if(!machineId){alertMsg('Machine is missing.');return}try{data=await api();const m=data.machine;$('machineName').textContent=[m.brand,m.model].filter(Boolean).join(' ')||m.machineType;$('machineMeta').textContent=[m.machineType,m.fleetNumber?'Fleet '+m.fleetNumber:'',m.serialNumber||m.regNumber||''].filter(Boolean).join(' · ');$('template').innerHTML=(data.templates||[]).map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');if(data.todayReport?.template_id)$('template').value=data.todayReport.template_id;$('hours').value=data.todayReport?.hour_meter_reading??data.latestHourMeter??0;$('serviceDay').checked=Boolean(data.todayReport);$('serviceDayLabel').textContent=(data.serviceDay||'Today')+' · Check ✓';$('syncNote').textContent=data?.sync?.message||'';if(data.todayReport){showPhoto(data.todayReport.display_photo_url);$('editBanner').textContent='✓ CHECKED TODAY · EDIT AVAILABLE UNTIL 00:00 EAT';$('editBanner').classList.remove('hidden');$('submit').textContent='✓ UPDATE TODAY\'S CHECK UP';alertMsg('Today\'s Check Up is saved. You can edit it until 00:00.',true)}render()}catch(e){alertMsg(e.message)}}$('template').onchange=render;$('displayPhoto').onchange=()=>{const f=$('displayPhoto').files?.[0];if(f)showPhoto(URL.createObjectURL(f))};$('form').onsubmit=async e=>{e.preventDefault();const t=currentTemplate();if(!t)return;try{$('submit').disabled=true;$('submit').textContent='Saving Check Up…';const answers=[];for(const item of t.items||[]){const el=document.querySelector(`[data-answer="${CSS.escape(String(item.id))}"]`);const noteEl=document.querySelector(`[data-note="${CSS.escape(String(item.id))}"]`);let value='',photoUrl='';if(inputType(item)==='PHOTO')photoUrl=await fileData(el.files?.[0]);else value=el.value;answers.push({itemId:item.id,value,photoUrl,note:noteEl?.value||''})}const displayPhotoUrl=await fileData($('displayPhoto').files?.[0]);const out=await api({method:'POST',body:JSON.stringify({machineId,templateId:t.id,hourMeterReading:Number($('hours').value),displayPhotoUrl,serviceDayChecked:$('serviceDay').checked,answers})});alertMsg(out.message||'Check Up saved.',true);$('submit').textContent='✓ CHECK UP SAVED / EDIT UNTIL 00:00';setTimeout(()=>location.reload(),700)}catch(err){alertMsg(err.message);$('submit').disabled=false;$('submit').textContent=data?.todayReport?'✓ UPDATE TODAY\'S CHECK UP':'✓ COMPLETE & SAVE CHECK UP'}};load()})();</script></body></html>
