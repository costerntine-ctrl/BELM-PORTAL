<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine Check Up — PORTAL-CWM</title><link rel="stylesheet" href="/theme-global.css?v=485-display-fit"><script src="/theme-manager.js?v=485-display-fit"></script><style>*{box-sizing:border-box}body{margin:0;background:#071a2d;color:#eef5ff;font-family:Inter,Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:#101d34;border-bottom:5px solid #ffd31a;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:800}.shell{max-width:820px;margin:auto;padding:18px}.hero,.card{background:#102037;border:1px solid #29435f;border-radius:16px;padding:17px;margin-bottom:14px}.eyebrow{color:#4ce39a;font-size:11px;font-weight:800;letter-spacing:.12em}.hero h1{margin:7px 0}.meta{color:#aab9cc}.sync-note{margin-top:10px;font-size:11px;color:#8fb6d8}.default-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.default-box{background:#0b192c;border:1px solid #36516f;border-radius:12px;padding:12px}.default-box b{display:block;font-size:11px;color:#8fa4bb;margin-bottom:7px}.default-box input,.default-box select{width:100%;padding:13px;border:1px solid #36516f;border-radius:11px;background:#0b192c;color:#fff;font:inherit}.service-type{font-weight:900;color:#fff}.day-check{display:flex;align-items:center;gap:10px;font-weight:900}.day-check input{width:20px;height:20px;accent-color:#18b866}.display-photo{grid-column:1/-1}.photo-preview{display:none;margin-top:10px;max-height:180px;max-width:100%;border-radius:10px;border:1px solid #36516f}.next-service{display:none;border-color:#18b866}.next-service.show{display:block}.next-service small{display:block;color:#79e7ae;margin-top:7px}.edit-banner{margin-top:12px;padding:10px;border-radius:10px;background:#3f3211;color:#ffe487;font-size:12px;font-weight:800}.items{display:grid;gap:11px}.item{background:#102037;border:1px solid #29435f;border-radius:14px;padding:15px}.item.safe{border-color:#187a50}.item.warn{border-color:#b88a16;background:#1b2735}.item.danger{border-color:#b93645;background:#261a29}.item-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.item h3{font-size:15px;margin:0}.item-meta{font-size:10px;color:#95a8be;margin-top:4px}.safety-pill{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;background:#21364d;color:#abc0d5}.safety-pill.GREEN{background:#123d2b;color:#73e7a9}.safety-pill.YELLOW{background:#4c3b12;color:#ffd862}.safety-pill.RED{background:#4d1720;color:#ff98a3}.answer-wrap{display:grid;gap:9px}.answer-wrap input,.answer-wrap select,.answer-wrap textarea{width:100%;padding:13px;border:1px solid #36516f;border-radius:11px;background:#0b192c;color:#fff;font:inherit}.issue-note{display:none}.item.warn .issue-note,.item.danger .issue-note{display:grid}.submit{width:100%;padding:15px;border:0;border-radius:12px;background:#18b866;color:#fff;font-weight:900;font-size:16px}.submit:disabled{opacity:.55}.alert{padding:13px;border-radius:11px;background:#4a1720;color:#ffdce2;margin-bottom:13px}.success{background:#103f2b;color:#caffdf}.hidden{display:none!important}.no-template{padding:20px;text-align:center;color:#afbdd0}@media(max-width:600px){.default-grid{grid-template-columns:1fr}.display-photo{grid-column:auto}.top{font-size:13px}.shell{padding:12px}}</style></head><body><header class="top"><a href="/portal/dashboard?view=machines">← Machines</a><b>CHECK UP · CHECKLIST</b></header><main class="shell"><div id="alert" class="alert hidden"></div><section class="hero"><div class="eyebrow">TODAY'S MACHINE CHECK UP</div><h1 id="machineName">Loading…</h1><div id="machineMeta" class="meta"></div><div id="syncNote" class="sync-note"></div><div id="editBanner" class="edit-banner hidden"></div></section><form id="form"><section class="card"><div class="default-grid"><div class="default-box display-photo"><b>DISPLAY PHOTO · REQUIRED</b><input id="displayPhoto" type="file" accept="image/*" capture="environment"><img id="photoPreview" class="photo-preview" alt="Machine display photo"></div><div class="default-box"><b>SERVICE TYPE</b><div id="serviceType" class="service-type">—</div></div><div class="default-box"><b>HRS METER</b><input id="hours" type="number" min="0" step="0.1" required></div><div class="default-box"><b>SERVICE DAY</b><label class="day-check"><input id="serviceDay" type="checkbox" required><span id="serviceDayLabel">Check ✓</span></label></div><div id="nextServiceBox" class="default-box next-service"><b>NEXT SERVICE TYPE · REQUIRED</b><select id="nextService"><option value="">— Select next service —</option><option value="250">250 HRS</option><option value="500">500 HRS</option><option value="1000">1000 HRS</option><option value="2000">2000 HRS</option></select><small id="nextDue"></small></div><div class="default-box"><b>CHECKLIST TEMPLATE</b><select id="template" required></select></div></div></section><section id="items" class="items"></section><section class="card"><button id="submit" class="submit" type="submit">✓ COMPLETE & SAVE CHECK UP</button></section></form></main><script>(function(){const token=localStorage.getItem('belm_customer_token')||'';const machineId=new URLSearchParams(location.search).get('machine')||'';const $=id=>document.getElementById(id);let data=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function alertMsg(m,ok=false){$('alert').textContent=m;$('alert').className='alert'+(ok?' success':'');$('alert').classList.toggle('hidden',!m)}async function api(opt={}){const r=await fetch('/api/api/customer_checkup.php'+(opt.method?'':'?machine='+encodeURIComponent(machineId)),{...opt,cache:'no-store',headers:{Authorization:'Bearer '+token,...(opt.body?{'Content-Type':'application/json'}:{})}});const t=await r.text();let d;try{d=JSON.parse(t)}catch(_){throw new Error('Could not load Check Up.')}if(!r.ok)throw new Error(d?.error||'Check Up request failed.');return d}function currentTemplate(){return data?.templates?.find(t=>String(t.id)===String($('template').value))}function inputType(i){return String(i.inputType||i.input_type||i.type||'TEXT').trim().toUpperCase()}function required(i){return i.isRequired===true||i.is_required===true||i.is_required===1||i.is_required==='1'}function options(i,t){let o=Array.isArray(i.options)?i.options:[];if(t==='YES_NO'&&!o.length)o=['YES','NO'];return o.map(x=>typeof x==='object'?x.value:x).filter(Boolean)}function optionSafety(i,v){const m=i.optionSafety||i.option_safety||{};let s=m?.[v];if(!s&&inputType(i)==='YES_NO')s=String(v).toUpperCase()==='YES'?'GREEN':'RED';return String(s||i.safety_level||'GREEN').toUpperCase()}function control(i){const t=inputType(i),id=esc(i.id),req=required(i)?' required':'';if(t==='DROPDOWN'||t==='YES_NO')return `<select data-answer="${id}"${req}><option value="">— Select result —</option>${options(i,t).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`;if(t==='NUMBER')return `<input data-answer="${id}" type="number" step="any"${req}>`;if(t==='DATE')return `<input data-answer="${id}" type="date"${req}>`;if(t==='PHOTO')return `<input data-answer="${id}" type="file" accept="image/*" capture="environment"${req}>`;return `<input data-answer="${id}" type="text"${req}>`}function render(){const t=currentTemplate();$('serviceType').textContent=t?.service_type||'General Service';if(!t){$('items').innerHTML='<section class="card no-template">No active checklist template.</section>';return}$('items').innerHTML=(t.items||[]).map((x,i)=>`<article class="item" data-item="${esc(x.id)}"><div class="item-head"><div><h3>${i+1}. ${esc(x.label)}</h3><div class="item-meta">${esc(inputType(x))}${required(x)?' · Required':''}</div></div><span class="safety-pill GREEN" data-safety-pill>GREEN</span></div><div class="answer-wrap">${control(x)}<label class="issue-note">Issue / observation note<textarea data-note="${esc(x.id)}" rows="2"></textarea></label></div></article>`).join('');document.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('change',()=>updateSafety(el)));prefillToday()}function updateSafety(el){const i=currentTemplate()?.items?.find(x=>String(x.id)===String(el.dataset.answer));if(!i)return;const c=el.closest('.item'),v=inputType(i)==='PHOTO'?(el.files?.length?'PHOTO':''):el.value,s=v?optionSafety(i,v):'GREEN';c.classList.remove('safe','warn','danger');if(s==='GREEN')c.classList.add('safe');if(s==='YELLOW')c.classList.add('warn');if(s==='RED')c.classList.add('danger');const p=c.querySelector('[data-safety-pill]');p.className='safety-pill '+s;p.textContent=s}function prefillToday(){const r=data?.todayReport;if(!r)return;for(const a of r.answers||[]){const el=document.querySelector(`[data-answer="${CSS.escape(String(a.template_item_id))}"]`),n=document.querySelector(`[data-note="${CSS.escape(String(a.template_item_id))}"]`);if(el&&el.type!=='file')el.value=a.value||'';if(n)n.value=a.note||'';if(el)updateSafety(el)}}async function fileData(f){if(!f)return'';return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}function showPhoto(s){if(!s)return;$('photoPreview').src=s;$('photoPreview').style.display='block'}function serviceDayUI(){const on=$('serviceDay').checked;$('nextServiceBox').classList.toggle('show',on);$('nextService').required=on;if(!on)$('nextService').value='';updateDue()}function updateDue(){const h=Number($('hours').value),n=Number($('nextService').value);$('nextDue').textContent=h>=0&&n?`Next service due at ${(h+n).toLocaleString()} HRS`:''}async function load(){if(!token){location.replace('/login');return}try{data=await api();const m=data.machine;$('machineName').textContent=[m.brand,m.model].filter(Boolean).join(' ')||m.machineType;$('machineMeta').textContent=[m.machineType,m.fleetNumber?'Fleet '+m.fleetNumber:'',m.serialNumber||''].filter(Boolean).join(' · ');$('template').innerHTML=(data.templates||[]).map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');if(data.todayReport?.template_id)$('template').value=data.todayReport.template_id;$('hours').value=data.todayReport?.hour_meter_reading??data.latestHourMeter??0;$('serviceDay').checked=Boolean(data.todayReport);if(data.todayReport&&[250,500,1000,2000].includes(Number(m.serviceIntervalHours)))$('nextService').value=String(m.serviceIntervalHours);$('serviceDayLabel').textContent=(data.serviceDay||'Today')+' · Check ✓';$('syncNote').textContent=data?.sync?.message||'';if(data.todayReport){showPhoto(data.todayReport.display_photo_url);$('editBanner').textContent='✓ CHECKED TODAY · EDIT AVAILABLE UNTIL 00:00 EAT';$('editBanner').classList.remove('hidden');$('submit').textContent='✓ UPDATE TODAY\'S CHECK UP'}serviceDayUI();render()}catch(e){alertMsg(e.message)}}$('template').onchange=render;$('serviceDay').onchange=serviceDayUI;$('hours').oninput=updateDue;$('nextService').onchange=updateDue;$('displayPhoto').onchange=()=>{const f=$('displayPhoto').files?.[0];if(f)showPhoto(URL.createObjectURL(f))};$('form').onsubmit=async e=>{e.preventDefault();const t=currentTemplate();if(!t)return;try{$('submit').disabled=true;const answers=[];for(const i of t.items||[]){const el=document.querySelector(`[data-answer="${CSS.escape(String(i.id))}"]`),n=document.querySelector(`[data-note="${CSS.escape(String(i.id))}"]`);let value='',photoUrl='';if(inputType(i)==='PHOTO')photoUrl=await fileData(el.files?.[0]);else value=el.value;answers.push({itemId:i.id,value,photoUrl,note:n?.value||''})}const out=await api({method:'POST',body:JSON.stringify({machineId,templateId:t.id,hourMeterReading:Number($('hours').value),displayPhotoUrl:await fileData($('displayPhoto').files?.[0]),serviceDayChecked:$('serviceDay').checked,nextServiceHours:Number($('nextService').value),answers})});alertMsg(`Check Up saved. Next ${out.nextServiceHours} HRS service due at ${out.nextServiceDueAtHours} HRS.`,true);setTimeout(()=>location.reload(),700)}catch(err){alertMsg(err.message);$('submit').disabled=false}};load()})();</script></body></html>
