<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General Report — Customer Operations</title><link rel="stylesheet" href="/theme-global.css?v=807-general-report"><script src="/theme-manager.js?v=807-general-report"></script><style>*{box-sizing:border-box}:root{--bg:#f4f7fb;--panel:#fff;--text:#14243a;--muted:#68798e;--line:#d5e0ec;--blue:#1677e8;--green:#16b866;--yellow:#f4c51d;--navy:#102a56}html[data-theme="dark"]{--bg:#061525;--panel:#0b1d31;--text:#f4f8fc;--muted:#a8bacb;--line:#244b69}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--navy);color:#fff;border-bottom:4px solid var(--yellow)}.top a,.top button{border:1px solid #57769b;border-radius:9px;background:#123862;color:#fff;padding:9px 13px;font-weight:800;text-decoration:none;cursor:pointer}.top-actions{display:flex;gap:8px}.shell{width:min(1220px,calc(100% - 24px));margin:auto;padding:22px 0 44px}.hero{padding:22px;border-radius:18px;background:linear-gradient(135deg,#0d4fa3,#1278c9);color:#fff;border-bottom:5px solid var(--green);margin-bottom:18px}.hero small{font-weight:900;color:#bff4d3;letter-spacing:.08em}.hero h1{margin:4px 0 6px;font-size:31px}.hero p{margin:0;color:#e9f4ff;line-height:1.5}.section{margin-bottom:20px}.section h2{font-size:18px;margin:0 0 5px}.section>p{margin:0 0 12px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.card{min-height:145px;display:flex;flex-direction:column;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:inherit;text-decoration:none;box-shadow:0 7px 22px rgba(12,38,65,.06)}.card:hover{transform:translateY(-2px);border-color:#2785d7}.card .tag{font-size:9px;font-weight:900;color:#1973c6;letter-spacing:.07em}.card h3{font-size:15px;margin:8px 0 6px}.card p{font-size:11.5px;line-height:1.5;color:var(--muted);margin:0;flex:1}.card strong{margin-top:12px;color:#168755;font-size:11px}.notice{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);font-size:12px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}.top{align-items:flex-start;gap:8px;flex-direction:column}.top-actions{width:100%}}</style></head><body><header class="top"><strong>CUSTOMER · GENERAL REPORT</strong><div class="top-actions"><a href="/customer-admin-dashboard/">← Customer Dashboard</a><button id="refresh" type="button">↻ Refresh</button></div></header><main class="shell"><section class="hero"><small>ALL ROLE REPORTS · NO ANALYSIS</small><h1 id="title">General Report</h1><p>One customer report centre for operational records from all customer roles. Analysis is kept separate.</p></section><div id="content"><div class="notice">Loading customer reports…</div></div></main><script src="/customer-general-report/app.js?v=807-general-report"></script></body></html>
