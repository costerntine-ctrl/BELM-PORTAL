<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="cache-control" content="no-store">
<title>Operator Dashboard — BELM Portal</title>
<link rel="stylesheet" href="/customer-belm-shell-v770.css" />
</head>
<body class="belm-admin">

<div class="belm-shell" id="belmShell">
  <aside class="belm-sidebar">
    <div class="belm-brand">
      <svg class="belm-brand__mark" viewBox="0 0 716 716" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M508.749 317.399C516.777 287.314 508.991 253.884 485.389 230.282C461.788 206.681 428.36 198.895 398.273 206.923C376.231 184.928 343.39 174.956 311.148 183.596C278.906 192.234 255.45 217.292 247.36 247.361C217.291 255.451 192.233 278.91 183.595 311.149C174.957 343.391 184.927 376.232 206.924 398.274C198.896 428.359 206.683 461.789 230.284 485.391C253.885 508.992 287.313 516.779 317.401 508.75C339.442 530.745 372.286 540.717 404.525 532.079C436.767 523.441 460.223 498.384 468.313 468.315C498.383 460.224 523.44 436.766 532.078 404.526C540.716 372.285 530.747 339.443 508.749 317.402V317.399Z" fill="#F5C518"/>
      </svg>
      <div class="belm-brand__text">
        <div class="belm-brand__name" data-customer-name-upper>COMPANY</div>
        <div class="belm-brand__tag">OPERATOR PORTAL</div>
      </div>
    </div>
    <nav class="belm-nav">
      <a href="/customer-operator-dashboard/" class="belm-nav__item is-active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        My Machine
      </a>
    </nav>
    <div class="belm-nav__divider"></div>
    <div class="belm-sidebar__foot">
      <a href="/operator/" class="belm-nav__item" id="logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Log out
      </a>
    </div>
  </aside>

  <div class="belm-main">
    <header class="belm-topbar">
      <button class="belm-topbar__menu" id="sidebarToggle" type="button" aria-label="Toggle menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="belm-topbar__right">
        <div class="belm-user">
          <div class="belm-user__avatar">
            <svg viewBox="0 0 716 716" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M508.749 317.399C516.777 287.314 508.991 253.884 485.389 230.282C461.788 206.681 428.36 198.895 398.273 206.923C376.231 184.928 343.39 174.956 311.148 183.596C278.906 192.234 255.45 217.292 247.36 247.361C217.291 255.451 192.233 278.91 183.595 311.149C174.957 343.391 184.927 376.232 206.924 398.274C198.896 428.359 206.683 461.789 230.284 485.391C253.885 508.992 287.313 516.779 317.401 508.75C339.442 530.745 372.286 540.717 404.525 532.079C436.767 523.441 460.223 498.384 468.313 468.315C498.383 460.224 523.44 436.766 532.078 404.526C540.716 372.285 530.747 339.443 508.749 317.402V317.399Z" fill="#F5C518"/></svg>
          </div>
          <div>
            <div class="belm-user__name" data-operator-name>OPERATOR</div>
            <div class="belm-user__role">MACHINE OPERATOR</div>
          </div>
        </div>
      </div>
    </header>

    <main class="belm-content">
      <section class="belm-hero">
        <svg class="belm-hero__silhouette" viewBox="0 0 400 220" preserveAspectRatio="xMaxYMid slice" xmlns="http://www.w3.org/2000/svg">
          <polygon points="0,220 40,150 90,220" fill="#0f2a48"/>
          <polygon points="70,220 140,110 220,220" fill="#123055"/>
          <polygon points="180,220 260,90 340,220" fill="#0f2a48"/>
        </svg>
        <div class="belm-hero__body">
          <h1 class="belm-hero__title">Operator Dashboard</h1>
          <p class="belm-hero__subtitle" id="machineLabel">Your Machine</p>
        </div>
      </section>

      <section class="belm-stats">
        <div class="belm-stat-card">
          <div class="belm-stat-card__icon belm-stat-card__icon--blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="#04101f" stroke-width="2"><path d="M3 17l3-7h5l2 4h6l2 3"/><circle cx="7" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg>
          </div>
          <div><div class="belm-stat-card__label">Machine Status</div><div class="belm-stat-card__value" id="statStatus" style="font-size:22px">–</div></div>
        </div>
        <div class="belm-stat-card">
          <div class="belm-stat-card__icon belm-stat-card__icon--gold">
            <svg viewBox="0 0 24 24" fill="none" stroke="#04101f" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>
          </div>
          <div><div class="belm-stat-card__label">Hours This Shift</div><div class="belm-stat-card__value" id="statHours">–</div></div>
        </div>
        <div class="belm-stat-card">
          <div class="belm-stat-card__icon belm-stat-card__icon--green">
            <svg viewBox="0 0 24 24" fill="none" stroke="#04101f" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
          </div>
          <div><div class="belm-stat-card__label">Containers This Shift</div><div class="belm-stat-card__value" id="statContainers">–</div></div>
        </div>
        <div class="belm-stat-card">
          <div class="belm-stat-card__icon belm-stat-card__icon--navy">
            <svg viewBox="0 0 24 24" fill="none" stroke="#f5c518" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
          </div>
          <div><div class="belm-stat-card__label">Last Checklist</div><div class="belm-stat-card__value" id="statChecklist" style="font-size:20px">–</div></div>
        </div>
      </section>

      <section class="belm-grid-2">
        <div class="belm-panel">
          <div class="belm-panel__head">
            <div class="belm-panel__title belm-panel__title--alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
              Machine Alerts
            </div>
          </div>
          <div class="belm-alert-list" id="alertList"><div class="belm-alert-row"><span class="belm-alert-row__label">Loading…</span></div></div>
        </div>

        <div class="belm-panel">
          <div class="belm-panel__head">
            <div class="belm-panel__title belm-panel__title--doc">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
              Latest Message
            </div>
          </div>
          <div class="belm-alert-list" id="messageList"><div class="belm-alert-row"><span class="belm-alert-row__label">Loading…</span></div></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="/customer-operator-dashboard/dashboard.js"></script>
</body>
</html>
