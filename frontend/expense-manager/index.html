<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BELM Expense / Payment</title><link rel="stylesheet" href="/theme-global.css?v=485-display-fit"><script src="/theme-manager.js?v=485-display-fit"></script><link rel="stylesheet" href="/expense-manager/expense.css?v=1"></head><body><header class="top"><a href="/concept-dashboards/09-finance-accounts/" class="brand"><b>BELM</b><span>Finance / Accounts</span></a><div class="top-actions"><a href="/concept-dashboards/09-finance-accounts/" class="btn">← Finance Dashboard</a><button id="refreshButton" class="btn">Refresh</button></div></header><main><section class="hero"><div><p>ACCOUNTING & BILLING</p><h1>Expense Payment</h1><span>Add expense on the left. After Save, it appears immediately in the Payment list.</span></div></section><div id="alert" class="alert hidden"></div><section class="workspace"><aside class="entry"><div class="head"><div><p>ADD EXPENSES</p><h2 id="formTitle">Add Expense</h2></div></div><form id="expenseForm"><input id="expenseId" type="hidden"><input id="receiptUrl" type="hidden"><label>Expense Category<select id="category" required><option value="OIL_LUBS">Oil / Lubricants</option><option value="TIRES">Tires</option><option value="TRANSPORT">Transport</option><option value="FUEL">Fuel</option><option value="SPARE">Spare</option><option value="OTHERS">Others</option></select></label><label>Description<input id="description" required placeholder="Describe expense"></label><div class="grid2"><label>Quantity<input id="quantity" type="number" min="0.01" step="0.01" value="1" required></label><label>Price / Unit (TZS)<input id="unitPrice" type="number" min="0" step="0.01" required></label></div><label>Payment Method<select id="paymentMethod"><option value="CASH">Cash</option><option value="BANK">Bank</option><option value="MOBILE_MONEY">Mobile Money</option><option value="CHEQUE">Cheque</option><option value="OTHER">Other</option></select></label><label>Date<input id="date" type="date" required></label><label>Upload Receipt<input id="receiptFile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><span id="receiptStatus" class="muted"></span></label><div class="total">Total: <strong id="totalPreview">TZS 0</strong></div><div class="form-actions"><button id="cancelEdit" class="btn hidden" type="button">Cancel Edit</button><button id="saveButton" class="save" type="submit">Save</button></div></form></aside><section class="list"><div class="list-head"><div><p>PAYMENT</p><h2>Payment List</h2></div><input id="search" type="search" placeholder="Search payment..."></div><div class="filters" id="filters"><button class="active" data-filter="ALL">All</button><button data-filter="OIL_LUBS">Oil/Lubs</button><button data-filter="TIRES">Tires</button><button data-filter="TRANSPORT">Transport</button><button data-filter="FUEL">Fuel</button><button data-filter="SPARE">Spare</button><button data-filter="OTHERS">Others</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Qty</th><th>Price</th><th>Total</th><th>Method</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody></table></div></section></section></main><script src="/delete-confirm.js"></script><script src="/edit-confirm.js"></script><script src="/expense-manager/expense.js?v=1"></script></body></html>
