<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General Report — PORTAL-CWM</title><link rel="stylesheet" href="/theme-global.css?v=485-display-fit"><link rel="stylesheet" href="/general-report/belm-report-brand-v613.css?v=630-general-report"><script src="/theme-manager.js?v=485-display-fit"></script><style>*{box-sizing:border-box}:root{--blue:#1677e8;--green:#16b866;--yellow:#f4c51d;--text:#14243a;--muted:#68798e;--panel:#fff;--panel2:#edf5ff;--line:#d5e0ec;--page:#f4f7fb;--active:#e9f3ff}html[data-theme="dark"]{--text:#f4f8fc;--muted:#a8bacb;--panel:#0b1d31;--panel2:#0d2740;--line:#244b69;--page:#061525;--active:#123557}body{margin:0;background:var(--page)!important;color:var(--text)!important;font-family:Inter,system-ui,sans-serif}.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#102a56;color:#fff;border-bottom:4px solid var(--yellow)}.topbar a{color:#fff;text-decoration:none}.shell{max-width:1180px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#0d4fa3,#1278c9);color:#fff;border-radius:18px;padding:20px;margin-bottom:15px;border-bottom:5px solid var(--green)}.hero small{color:#d7f7e5;font-weight:800}.hero h1{margin:3px 0;color:#fff}.hero p{color:#eaf4ff}.panel{background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:15px}.selector{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px}.selector label{display:grid;gap:5px;font-size:11px;font-weight:800}.selector select,.selector input{padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text)}.summary{margin-top:10px;background:var(--panel2);padding:11px;border-radius:9px;border-left:4px solid var(--blue)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.report{padding:15px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px;text-align:left;cursor:pointer;min-height:96px}.report:nth-child(4n+1){box-shadow:inset 0 4px 0 var(--blue)}.report:nth-child(4n+2){box-shadow:inset 0 4px 0 var(--green)}.report:nth-child(4n+3){box-shadow:inset 0 4px 0 var(--yellow)}.report:nth-child(4n+4){box-shadow:inset 0 4px 0 #23b7d5}.report.active{background:var(--active);outline:2px solid #1677e844}.report b{display:block;margin-bottom:5px;font-weight:800}.report span{font-size:12px;color:var(--muted)}.exports{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.exports button{border:0;border-radius:9px;padding:10px 13px;font-weight:800}.csv{background:var(--green);color:#fff}.pdf{background:var(--blue);color:#fff}.print{background:#102a56;color:#fff}.output{border-top:1px solid var(--line);padding-top:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{background:var(--panel2)}.empty{padding:18px;color:var(--muted);text-align:center}.alert{background:#4a1818;color:#ffd8d8;padding:11px;border-radius:9px;margin-bottom:12px}.hidden{display:none!important}@media(max-width:760px){.selector,.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.selector,.grid{grid-template-columns:1fr}.report{min-height:88px}.exports button{flex:1}}@media print{.topbar,.selector-panel,.grid,.exports{display:none!important}}</style></head><body><header class="topbar"><a href="/customer-workshop/?actor=customer">← Workshop</a><strong>PORTAL-CWM · GENERAL REPORT</strong></header><main class="shell"><section class="hero"><small>WORKSHOP REPORT CENTRE</small><h1 id="title">General Report</h1><p>Checklist, fuel, operator, technician, Job Card, procurement, Store and maintenance reports in one report centre.</p></section><div id="alert" class="alert hidden"></div><section class="panel selector-panel"><div class="selector"><label>MACHINE<select id="machine"><option value="">Select machine…</option></select></label><label>FROM<input id="from" type="date"></label><label>TO<input id="to" type="date"></label></div><div id="summary" class="summary">Select a machine.</div></section><section class="panel"><div id="reports" class="grid"><button class="report" data-type="checklist"><b>Checklist Report</b><span>Completed machine checklists and safety results.</span></button><button class="report" data-type="fuel"><b>Fuel Consumption Report</b><span>Fuel usage and consumption records.</span></button><button class="report" data-type="operator"><b>Operator Report</b><span>Machine Operator reports and operating records.</span></button><button class="report" data-type="technician"><b>Technician / Maintenance Report</b><span>Technician activity and maintenance work.</span></button><button class="report" data-type="job-card"><b>Job Card Report</b><span>Opened, received, diagnosis, testing and completed work.</span></button><button class="report" data-type="procurement"><b>Procurement Report</b><span>Spare Parts Purchase and procurement records.</span></button><button class="report" data-type="store"><b>Store / Spare Parts Report</b><span>Store stock, issues, returns and spare movements.</span></button><button class="report" data-type="service"><b>Service / Maintenance Report</b><span>Service intervals, due service and maintenance history.</span></button><button class="report" data-type="breakdown"><b>Breakdown Report</b><span>Breakdown, diagnosis and repair history.</span></button><button class="report" data-type="operator-checkup"><b>Operator Checkup Report</b><span>Daily operator machine checkup records.</span></button></div><div class="exports"><button id="csv" class="csv">Download CSV</button><button id="pdf" class="pdf">PDF</button><button id="print" class="print">Print</button></div><div class="output"><h2 id="reportTitle">Select report</h2><p id="note" class="empty">Choose a report above.</p><div class="tablewrap"><table id="table" class="hidden"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></div></section></main><script>(function(){const token=localStorage.getItem('belm_customer_token')||'';if(!token){location.replace('/login');return}const $=x=>document.getElementById(x),params=new URLSearchParams(location.search);let machines=[],type='',rows=[],cols=[];const labels={checklist:'Checklist Report',fuel:'Fuel Consumption Report',operator:'Operator Report',technician:'Technician / Maintenance Report','job-card':'Job Card Report',procurement:'Procurement Report',store:'Store / Spare Parts Report',service:'Service / Maintenance Report',breakdown:'Breakdown Report','operator-checkup':'Operator Checkup Report'};async function api(p){const r=await fetch('/api/customer-portal'+p,{cache:'no-store',headers:{Authorization:'Bearer '+token}}),t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{}if(!r.ok)throw Error(d?.error||'Request failed');return d}function machine(){return machines.find(x=>String(x.id)===String($('machine').value))}function name(m){return[m?.brand,m?.model].filter(Boolean).join(' ')||m?.machineType||'Machine'}function show(c,r){cols=c;rows=r;$('head').innerHTML=c.map(x=>'<th>'+x.label+'</th>').join('');$('body').innerHTML=r.length?r.map(x=>'<tr>'+c.map(y=>'<td>'+String(x[y.key]??'—')+'</td>').join('')+'</tr>').join(''):'<tr><td class="empty" colspan="'+c.length+'">No records found.</td></tr>';$('table').classList.remove('hidden');$('note').classList.add('hidden')}async function load(){const m=machine();if(!type)return;if(!m){$('summary').textContent='Select a machine first to open '+labels[type]+'.';$('machine').focus();return}$('reportTitle').textContent=name(m)+' — '+labels[type];$('note').classList.remove('hidden');$('note').textContent='Loading…';$('table').classList.add('hidden');try{if(type==='checklist'){const d=await api('/machines/'+m.id+'/reports');return show([{key:'date',label:'Date'},{key:'report',label:'Checklist'},{key:'status',label:'Status'},{key:'by',label:'Filled By'}],(Array.isArray(d)?d:[]).map(x=>({date:String(x.createdAt||x.created_at||'').slice(0,10),report:x.templateName||x.template_name||'Checklist',status:x.overallStatus||x.overall_status||'—',by:x.filledBy||x.filled_by||'—'})))}if(['job-card','breakdown','technician','service'].includes(type)){const d=await api('/machines/'+m.id+'/job-cards');return show([{key:'date',label:'Date'},{key:'no',label:'Job Card'},{key:'title',label:type==='breakdown'?'Breakdown':'Work / Service'},{key:'status',label:'Status'},{key:'tech',label:'Technician'}],(Array.isArray(d)?d:[]).map(x=>({date:String(x.created_at||x.createdAt||'').slice(0,10),no:x.job_card_no||x.jobCardNo||'—',title:x.title||x.problem||'—',status:x.status||'—',tech:x.technician_name||x.technicianName||'—'})))}if(type==='fuel'){location.href='/customer-fuel-usage/?machine='+encodeURIComponent(m.id);return}if(type==='procurement'){location.href='/customer-procurement/?machine='+encodeURIComponent(m.id);return}if(type==='store'){location.href='/customer-store/?machine='+encodeURIComponent(m.id);return}if(type==='operator'){location.href='/operator/?machine='+encodeURIComponent(m.id)+'&report=1';return}$('note').textContent='This report remains machine-scoped and uses the saved workshop history.'}catch(e){$('note').textContent=e.message;$('alert').textContent=e.message;$('alert').classList.remove('hidden')}}function csv(){if(!rows.length||!cols.length)return alert('Load report records first.');const data=[cols.map(x=>x.label),...rows.map(r=>cols.map(c=>r[c.key]??''))].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=(name(machine())+'-'+labels[type]).replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.csv';a.click();URL.revokeObjectURL(a.href)}async function init(){try{const d=await api('/dashboard');machines=Array.isArray(d?.machines)?d.machines:[];$('title').textContent=(d?.customer?.name||'Customer')+' General Report';$('machine').innerHTML='<option value="">Select machine…</option>'+machines.map(m=>'<option value="'+m.id+'">'+name(m)+(m.fleetNumber||m.fleet_number?' · '+(m.fleetNumber||m.fleet_number):'')+'</option>').join('');const wanted=params.get('machine');if(wanted&&machines.some(m=>String(m.id)===wanted)){$('machine').value=wanted;$('machine').dispatchEvent(new Event('change'))}}catch(e){$('alert').textContent=e.message;$('alert').classList.remove('hidden')}}$('machine').onchange=()=>{const m=machine();$('summary').textContent=m?name(m)+' · Fleet: '+(m.fleetNumber||m.fleet_number||'—')+' · Serial: '+(m.serialNumber||m.serial_number||'—'):'Select a machine.';if(type)load()};$('reports').onclick=e=>{const b=e.target.closest('[data-type]');if(!b)return;type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));$('reportTitle').textContent=labels[type];load()};$('from').onchange=load;$('to').onchange=load;$('csv').onclick=csv;$('pdf').onclick=()=>print();$('print').onclick=()=>print();init()})();</script></body></html>
