<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>General Report — PORTAL-CWM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme-global.css?v=485-display-fit"><script src="/theme-manager.js?v=485-display-fit"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#14243a;font-family:Inter,sans-serif}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:#102a56;color:#fff}.topbar a,.topbar button{color:#fff;text-decoration:none}.topbar button{background:transparent;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:9px 12px}.shell{max-width:1180px;margin:auto;padding:22px}.hero{background:#0d4fa3;color:#fff;border-radius:18px;padding:22px;margin-bottom:16px}.hero h1{margin:4px 0}.selector-panel,.report-panel{background:#fff;border-radius:17px;padding:18px;box-shadow:0 8px 24px rgba(17,42,86,.07);margin-bottom:16px}.selector-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.selector-grid label{display:grid;gap:6px;font-size:12px;font-weight:800;color:#5e7188}.selector-grid select,.selector-grid input{padding:11px;border:1px solid #cbd8e8;border-radius:10px;font:inherit}.machine-summary{margin-top:12px;padding:12px;border-radius:11px;background:#eef5fd;color:#214c7d}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.report-btn{border:1px solid #d6e1ee;background:#fff;border-radius:14px;padding:16px;text-align:left;cursor:pointer;min-height:120px}.report-btn:hover,.report-btn.active{border-color:#1677e8;background:#edf5ff}.report-btn b{display:block;font-size:16px;margin-bottom:6px}.report-btn span{font-size:12px;color:#65768b}.export-bar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.export-bar button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.csv{background:#1ca85d;color:#fff}.pdf{background:#1f6fc9;color:#fff}.print{background:#26384f;color:#fff}.open-records{background:#ffc928;color:#17212e}.report-output{margin-top:16px;border-top:1px solid #e6edf5;padding-top:14px}.report-output h2{margin:0 0 5px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{padding:10px;border-bottom:1px solid #edf1f6;text-align:left;font-size:13px}.table th{background:#f5f8fc}.empty{padding:18px;text-align:center;color:#718196}.alert{padding:12px 14px;border-radius:10px;background:#ffe8e8;color:#9d2020;margin-bottom:14px}.hidden{display:none!important}@media(max-width:850px){.report-grid{grid-template-columns:repeat(2,1fr)}.selector-grid{grid-template-columns:1fr}}@media(max-width:560px){.report-grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.export-bar button{flex:1 1 45%}}@media print{.topbar,.export-bar,.selector-panel,.report-grid{display:none!important}.shell{max-width:none;padding:0}.hero{background:#fff!important;color:#000!important;padding:0}.report-panel{box-shadow:none;padding:0}.report-output{border:0}}
  </style>
</head>
<body>
<header class="topbar"><a href="/customer-workshop/?actor=customer">← Workshop Main</a><strong>PORTAL-CWM · GENERAL REPORT</strong><button id="logoutButton">Log out</button></header>
<main class="shell">
  <section class="hero"><p style="font-size:11px;font-weight:800;letter-spacing:.12em;margin:0">MACHINE REPORT CENTRE</p><h1 id="companyTitle">General Report</h1><p>Select one machine, then select the report you want. Reports remain machine-specific.</p></section>
  <div id="alertBox" class="alert hidden"></div>
  <section class="selector-panel">
    <div class="selector-grid">
      <label>MACHINE<select id="machineSelect"><option value="">Select machine…</option></select></label>
      <label>FROM DATE<input id="fromDate" type="date"></label>
      <label>TO DATE<input id="toDate" type="date"></label>
    </div>
    <div id="machineSummary" class="machine-summary">Select a machine to open its reports.</div>
  </section>

  <section class="report-panel">
    <div class="report-grid" id="reportGrid">
      <button class="report-btn" data-report="checkup"><b>Checkup Report</b><span>Machine checklist / daily checkup history.</span></button>
      <button class="report-btn" data-report="operator-checkup"><b>Operator Checkup Report</b><span>Operator daily inspection and condition reports.</span></button>
      <button class="report-btn" data-report="operator-job-card"><b>Operator Job Card Reports</b><span>Operator-reported issues that generated operation/job-card records.</span></button>
      <button class="report-btn" data-report="spare-request"><b>Spare Request Report</b><span>Machine spare/material requests and their status.</span></button>
      <button class="report-btn" data-report="maintenance"><b>Maintenance Report</b><span>Service status, maintenance history and maintenance Job Cards.</span></button>
      <button class="report-btn" data-report="breakdown"><b>Breakdown Report</b><span>Breakdown cases, status and completed repair history.</span></button>
      <button class="report-btn" data-report="fuel"><b>Fuel Consumption Report</b><span>Fuel top-ups, usage and machine consumption records.</span></button>
    </div>

    <div class="export-bar">
      <button id="csvButton" class="csv" type="button">Download CSV</button>
      <button id="pdfButton" class="pdf" type="button">Download PDF</button>
      <button id="printButton" class="print" type="button">Print</button>
      <button id="openRecordsButton" class="open-records" type="button">Open Machine Records</button>
    </div>

    <div id="reportOutput" class="report-output"><h2 id="reportTitle">Select a report</h2><p id="reportNote" class="empty">Choose a machine and report above.</p><div class="table-wrap"><table id="reportTable" class="table hidden"><thead><tr id="reportHead"></tr></thead><tbody id="reportBody"></tbody></table></div></div>
  </section>
</main>
<script>
(function(){
  const token=localStorage.getItem('belm_customer_token')||''; if(!token){location.replace('/login');return;}
  const $=id=>document.getElementById(id); let machines=[],selectedReport=''; let currentRows=[]; let currentColumns=[];
  const labels={checkup:'Checkup Report','operator-checkup':'Operator Checkup Report','operator-job-card':'Operator Job Card Reports','spare-request':'Spare Request Report',maintenance:'Maintenance Report',breakdown:'Breakdown Report',fuel:'Fuel Consumption Report'};
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function api(path){const r=await fetch('/api/customer-portal'+path,{cache:'no-store',headers:{Authorization:'Bearer '+token}});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(_){}if(!r.ok)throw new Error(d?.error||'Request failed.');return d;}
  function selectedMachine(){return machines.find(m=>String(m.id)===String($('machineSelect').value));}
  function machineName(m){return [m?.brand,m?.model].filter(Boolean).join(' ')||m?.machineType||m?.machine_type||'Machine';}
  function setAlert(m=''){$('alertBox').textContent=m;$('alertBox').classList.toggle('hidden',!m);}
  function filterDate(rows){const from=$('fromDate').value,to=$('toDate').value;return rows.filter(r=>{const raw=r.date||r.createdAt||r.created_at||r.reportedAt||r.reported_at||'';if(!raw)return true;const d=String(raw).slice(0,10);return(!from||d>=from)&&(!to||d<=to);});}
  function renderRows(columns,rows){currentColumns=columns;currentRows=filterDate(rows);$('reportHead').innerHTML=columns.map(c=>`<th>${esc(c.label)}</th>`).join('');$('reportBody').innerHTML=currentRows.length?currentRows.map(r=>`<tr>${columns.map(c=>`<td>${esc(r[c.key]??'—')}</td>`).join('')}</tr>`).join(''):'<tr><td colspan="'+columns.length+'" class="empty">No records found for selected period.</td></tr>';$('reportTable').classList.remove('hidden');$('reportNote').classList.add('hidden');}
  async function loadReport(){const m=selectedMachine();if(!m||!selectedReport){return;}setAlert('');$('reportTitle').textContent=`${machineName(m)} — ${labels[selectedReport]}`;$('reportNote').textContent='Loading report…';$('reportNote').classList.remove('hidden');$('reportTable').classList.add('hidden');try{
    if(selectedReport==='checkup'){
      const d=await api('/machines/'+encodeURIComponent(m.id)+'/reports');const rows=(Array.isArray(d)?d:[]).map(x=>({date:(x.createdAt||x.created_at||'').slice(0,10),report:x.templateName||x.template_name||'Checklist',status:x.overallStatus||x.overall_status||'—',filledBy:x.filledBy||x.filled_by||'—'}));return renderRows([{key:'date',label:'Date'},{key:'report',label:'Checkup'},{key:'status',label:'Status'},{key:'filledBy',label:'Filled By'}],rows);
    }
    if(selectedReport==='maintenance'){
      const [jobs,service]=await Promise.all([api('/machines/'+encodeURIComponent(m.id)+'/job-cards'),api('/machines/'+encodeURIComponent(m.id)+'/service-status')]);const rows=(Array.isArray(jobs)?jobs:[]).map(x=>({date:(x.created_at||x.createdAt||'').slice(0,10),jobCard:x.job_card_no||x.jobCardNo||'—',title:x.title||'Maintenance',status:x.status||'—',technician:x.technician_name||x.technicianName||'—'}));rows.unshift({date:'',jobCard:'SERVICE',title:`Service Level: ${service?.level||'—'} · Hours: ${service?.totalHours??'—'}`,status:service?.isOverdue?'OVERDUE':'STATUS',technician:'—'});return renderRows([{key:'date',label:'Date'},{key:'jobCard',label:'Job Card'},{key:'title',label:'Maintenance'},{key:'status',label:'Status'},{key:'technician',label:'Technician'}],rows);
    }
    if(selectedReport==='fuel'){location.href='/customer-fuel-usage/?machine='+encodeURIComponent(m.id);return;}
    $('reportNote').innerHTML='This report is linked to the selected machine records. Use <b>Open Machine Records</b> to view the live records while the dedicated export mapping is being consolidated.';
  }catch(e){$('reportNote').textContent=e.message||'Could not load report.';setAlert(e.message||'Could not load report.');}}
  function openRecords(){const m=selectedMachine();if(!m){setAlert('Select a machine first.');return;}if(selectedReport==='fuel'){location.href='/customer-fuel-usage/?machine='+encodeURIComponent(m.id);return;}if(selectedReport==='breakdown'||selectedReport==='maintenance'||selectedReport==='operator-job-card'){location.href='/breakdown-workflow/?actor=customer&machine='+encodeURIComponent(m.id);return;}if(selectedReport==='spare-request'){location.href='/customer-procurement/?machine='+encodeURIComponent(m.id);return;}location.href='/portal/dashboard?view=machines&machineId='+encodeURIComponent(m.id);}
  function csv(){const m=selectedMachine();if(!m||!selectedReport){setAlert('Select a machine and report first.');return;}if(!currentRows.length){setAlert('Load a report with records before downloading CSV.');return;}const lines=[currentColumns.map(c=>c.label),...currentRows.map(r=>currentColumns.map(c=>String(r[c.key]??'')))].map(row=>row.map(v=>'"'+v.replace(/"/g,'""')+'"').join(','));const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(machineName(m)+'-'+labels[selectedReport]).replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.csv';a.click();URL.revokeObjectURL(a.href);}
  async function init(){try{const d=await api('/dashboard');machines=Array.isArray(d?.machines)?d.machines:[];$('companyTitle').textContent=(d?.customer?.name||'Customer')+' General Report';$('machineSelect').innerHTML='<option value="">Select machine…</option>'+machines.map(m=>`<option value="${esc(m.id)}">${esc(machineName(m))}${m.fleetNumber||m.fleet_number?' · '+esc(m.fleetNumber||m.fleet_number):''}</option>`).join('');}catch(e){setAlert(e.message);}}
  $('machineSelect').onchange=()=>{const m=selectedMachine();$('machineSummary').textContent=m?`${machineName(m)} · Fleet: ${m.fleetNumber||m.fleet_number||'—'} · Serial: ${m.serialNumber||m.serial_number||'—'}`:'Select a machine to open its reports.';if(selectedReport)loadReport();};
  $('reportGrid').onclick=e=>{const b=e.target.closest('[data-report]');if(!b)return;selectedReport=b.dataset.report;document.querySelectorAll('[data-report]').forEach(x=>x.classList.toggle('active',x===b));loadReport();};
  $('fromDate').onchange=()=>{if(selectedReport)loadReport();};$('toDate').onchange=()=>{if(selectedReport)loadReport();};$('csvButton').onclick=csv;$('pdfButton').onclick=()=>window.print();$('printButton').onclick=()=>window.print();$('openRecordsButton').onclick=openRecords;$('logoutButton').onclick=()=>{localStorage.removeItem('belm_customer_token');localStorage.removeItem('belm_session_refreshed_belm_customer_token');location.replace('/login');};init();
})();
</script>
</body></html>
