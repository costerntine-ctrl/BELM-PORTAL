<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine Reports — PORTAL-CWM</title><link rel="stylesheet" href="/theme-global.css?v=485-display-fit"><script src="/theme-manager.js?v=485-display-fit"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#14243a;font-family:Inter,system-ui,sans-serif}.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#102a56;color:#fff}.topbar a{color:#fff;text-decoration:none}.shell{max-width:1180px;margin:auto;padding:20px}.hero{background:#0d4fa3;color:#fff;border-radius:18px;padding:20px;margin-bottom:15px}.hero h1{margin:3px 0}.panel{background:#fff;border-radius:16px;padding:17px;margin-bottom:15px;box-shadow:0 8px 24px rgba(17,42,86,.07)}.selector{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px}.selector label{display:grid;gap:5px;font-size:11px;font-weight:800}.selector select,.selector input{padding:10px;border:1px solid #cad7e6;border-radius:9px}.summary{margin-top:10px;background:#edf5ff;padding:11px;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.report{padding:15px;border:1px solid #d5e0ec;background:#fff;border-radius:13px;text-align:left;cursor:pointer;min-height:95px}.report.active{border-color:#1677e8;background:#edf5ff}.report b{display:block;margin-bottom:5px}.report span{font-size:12px;color:#68798e}.exports{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.exports button{border:0;border-radius:9px;padding:10px 13px;font-weight:800}.csv{background:#19a75b;color:#fff}.pdf{background:#176fc8;color:#fff}.print{background:#293a50;color:#fff}.output{border-top:1px solid #e4ebf3;padding-top:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;font-size:12px}th{background:#f5f8fb}.empty{padding:18px;color:#718196;text-align:center}.alert{background:#ffe8e8;color:#982323;padding:11px;border-radius:9px;margin-bottom:12px}.hidden{display:none!important}@media(max-width:760px){.selector,.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.selector,.grid{grid-template-columns:1fr}.exports button{flex:1 1 30%}}@media print{.topbar,.selector-panel,.grid,.exports{display:none!important}.shell{padding:0}.hero{background:#fff!important;color:#000!important}.panel{box-shadow:none}}</style></head><body><header class="topbar"><a href="/portal/dashboard?view=machines&from=cwm">← Machines</a><strong>PORTAL-CWM · MACHINE REPORTS</strong></header><main class="shell"><section class="hero"><small>MACHINE REPORT CENTRE</small><h1 id="title">Machine Reports</h1><p>Report button = records only. Check Up on the machine card remains the Checklist form.</p></section><div id="alert" class="alert hidden"></div><section class="panel selector-panel"><div class="selector"><label>MACHINE<select id="machine"><option value="">Select machine…</option></select></label><label>FROM<input id="from" type="date"></label><label>TO<input id="to" type="date"></label></div><div id="summary" class="summary">Select a machine.</div></section><section class="panel"><div id="reports" class="grid"><button class="report" data-type="checklist"><b>Check Up Report</b><span>Completed machine checklist records.</span></button><button class="report" data-type="operator-checkup"><b>Operator Checkup Report</b><span>Engine oil, gearbox oil, coolant, tires and brakes.</span></button><button class="report" data-type="operator-job-card"><b>Operator Job Card Reports</b><span>Job Cards raised/processed for this machine.</span></button><button class="report" data-type="spare-request"><b>Spare Request Report</b><span>Machine spare/material requests and procurement status.</span></button><button class="report" data-type="maintenance"><b>Maintenance Report</b><span>Maintenance Job Card activity and technician status.</span></button><button class="report" data-type="breakdown"><b>Breakdown Report</b><span>Breakdown/repair Job Card history.</span></button><button class="report" data-type="fuel"><b>Fuel Consumption Report</b><span>Fuel usage and consumption records.</span></button></div><div class="exports"><button id="csv" class="csv">Download CSV</button><button id="pdf" class="pdf">PDF</button><button id="print" class="print">Print</button></div><div class="output"><h2 id="reportTitle">Select report</h2><p id="note" class="empty">Choose a report above.</p><div class="tablewrap"><table id="table" class="hidden"><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></div></section></main><script>(function(){
const token=localStorage.getItem('belm_customer_token')||'';if(!token){location.replace('/login');return}
const $=x=>document.getElementById(x),params=new URLSearchParams(location.search);let machines=[],type='',rows=[],cols=[];
const labels={'checklist':'Check Up Report','operator-checkup':'Operator Checkup Report','operator-job-card':'Operator Job Card Reports','spare-request':'Spare Request Report','maintenance':'Maintenance Report','breakdown':'Breakdown Report','fuel':'Fuel Consumption Report'};
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
async function api(path){const r=await fetch('/api/customer-portal'+path,{cache:'no-store',headers:{Authorization:'Bearer '+token}}),t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(_){}if(!r.ok)throw Error(d?.error||'Request failed');return d}
function currentMachine(){return machines.find(x=>String(x.id)===String($('machine').value))}
function machineName(m){return[m?.brand,m?.model].filter(Boolean).join(' ')||m?.machineType||'Machine'}
function qs(){const q=new URLSearchParams();if($('from').value)q.set('from',$('from').value);if($('to').value)q.set('to',$('to').value);const x=q.toString();return x?'?'+x:''}
function inRange(v){if(!v)return true;const d=String(v).slice(0,10),f=$('from').value,t=$('to').value;return(!f||d>=f)&&(!t||d<=t)}
function show(c,r){cols=c;rows=r;$('head').innerHTML=c.map(x=>'<th>'+esc(x.label)+'</th>').join('');$('body').innerHTML=r.length?r.map(row=>'<tr>'+c.map(col=>'<td>'+esc(row[col.key]??'—')+'</td>').join('')+'</tr>').join(''):'<tr><td class="empty" colspan="'+c.length+'">No records found.</td></tr>';$('table').classList.remove('hidden');$('note').classList.add('hidden')}
async function load(){const m=currentMachine();if(!m||!type)return;$('reportTitle').textContent=machineName(m)+' — '+labels[type];$('note').classList.remove('hidden');$('note').textContent='Loading…';$('table').classList.add('hidden');$('alert').classList.add('hidden');try{
 if(type==='checklist'){const d=await api('/machines/'+m.id+'/reports');return show([{key:'date',label:'Date'},{key:'report',label:'Checklist'},{key:'hours',label:'HRS Meter'},{key:'status',label:'Status'},{key:'by',label:'Filled By'}],(Array.isArray(d)?d:[]).filter(x=>inRange(x.createdAt||x.created_at)).map(x=>({date:String(x.createdAt||x.created_at||'').slice(0,10),report:x.templateName||x.template_name||'Checklist',hours:x.hourMeterReading||x.hour_meter_reading||'—',status:x.overallStatus||x.overall_status||'—',by:x.filledBy||x.filled_by||'—'}))) }
 if(type==='operator-checkup'){const d=await api('/operator-reports/'+m.id+qs());const list=Array.isArray(d)?d:[];return show([{key:'date',label:'Date'},{key:'operator',label:'Operator'},{key:'status',label:'Status'},{key:'message',label:'Check Up'}],list.filter(x=>String(x.message||'').toUpperCase().includes('OPERATOR CHECK UP')).map(x=>({date:String(x.createdAt||x.created_at||'').slice(0,10),operator:x.operatorName||x.operator_name||'Operator',status:x.status||'—',message:x.message||'—'}))) }
 if(type==='spare-request'){const d=await api('/procurement-requests/'+m.id);const list=Array.isArray(d?.items)?d.items:[];return show([{key:'date',label:'Date'},{key:'part',label:'Part No.'},{key:'description',label:'Description'},{key:'qty',label:'Qty'},{key:'status',label:'Status'},{key:'by',label:'Requested By'}],list.filter(x=>inRange(x.requestedAt||x.requested_at||x.createdAt||x.created_at)).map(x=>({date:String(x.requestedAt||x.requested_at||x.createdAt||x.created_at||'').slice(0,10),part:x.partNumber||x.part_number||'—',description:x.description||'—',qty:x.quantity||'—',status:x.status||'—',by:x.requestedByName||x.requested_by_name||'—'}))) }
 if(['operator-job-card','maintenance','breakdown'].includes(type)){const d=await api('/machines/'+m.id+'/job-cards'+qs());const list=Array.isArray(d)?d:[];return show([{key:'date',label:'Date'},{key:'no',label:'Job Card'},{key:'title',label:type==='breakdown'?'Breakdown / Fault':'Work'},{key:'status',label:'Status'},{key:'tech',label:'Technician'}],list.map(x=>({date:String(x.createdAt||x.created_at||'').slice(0,10),no:x.job_card_no||x.jobCardNo||'—',title:x.title||x.problem||'—',status:x.status||'—',tech:x.technician_name||x.technicianName||'—'}))) }
 if(type==='fuel'){location.href='/customer-fuel-usage/?machine='+encodeURIComponent(m.id)+'&from=cwm';return}
}catch(e){$('note').textContent=e.message;$('alert').textContent=e.message;$('alert').classList.remove('hidden')}}
function csv(){if(!rows.length||!cols.length)return alert('Load report records first.');const data=[cols.map(x=>x.label),...rows.map(r=>cols.map(c=>r[c.key]??''))].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=(machineName(currentMachine())+'-'+labels[type]).replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.csv';a.click();URL.revokeObjectURL(a.href)}
async function init(){try{const d=await api('/machines');machines=Array.isArray(d?.machines)?d.machines:[];$('title').textContent=(d?.customer?.name||'Customer')+' Machine Reports';$('machine').innerHTML='<option value="">Select machine…</option>'+machines.map(m=>'<option value="'+esc(m.id)+'">'+esc(machineName(m)+(m.fleetNumber||m.fleet_number?' · '+(m.fleetNumber||m.fleet_number):''))+'</option>').join('');const wanted=params.get('machine');if(wanted&&machines.some(m=>String(m.id)===wanted)){$('machine').value=wanted;$('machine').dispatchEvent(new Event('change'))}}catch(e){$('alert').textContent=e.message;$('alert').classList.remove('hidden')}}
$('machine').onchange=()=>{const m=currentMachine();$('summary').textContent=m?machineName(m)+' · Fleet: '+(m.fleetNumber||m.fleet_number||'—')+' · Serial: '+(m.serialNumber||m.serial_number||'—'):'Select a machine.';if(type)load()};$('reports').onclick=e=>{const b=e.target.closest('[data-type]');if(!b)return;type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));load()};$('from').onchange=load;$('to').onchange=load;$('csv').onclick=csv;$('pdf').onclick=()=>window.print();$('print').onclick=()=>window.print();init();
})();</script></body></html>
