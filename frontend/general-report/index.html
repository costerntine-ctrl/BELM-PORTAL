<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General Report — PORTAL-CWM</title><link rel="stylesheet" href="/theme-global.css?v=485-display-fit"><link rel="stylesheet" href="/general-report/belm-report-brand-v613.css?v=632-report-pages"><script src="/theme-manager.js?v=485-display-fit"></script><style>*{box-sizing:border-box}:root{--blue:#1677e8;--green:#16b866;--yellow:#f4c51d;--text:#14243a;--muted:#68798e;--panel:#fff;--line:#d5e0ec;--page:#f4f7fb}html[data-theme="dark"]{--text:#f4f8fc;--muted:#a8bacb;--panel:#0b1d31;--line:#244b69;--page:#061525}body{margin:0;background:var(--page)!important;color:var(--text)!important;font-family:Inter,system-ui,sans-serif}.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#102a56;color:#fff;border-bottom:4px solid var(--yellow)}.topbar a{color:#fff;text-decoration:none}.shell{max-width:1180px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#0d4fa3,#1278c9);color:#fff;border-radius:18px;padding:20px;margin-bottom:15px;border-bottom:5px solid var(--green)}.hero small{color:#d7f7e5;font-weight:800}.hero h1{margin:3px 0;color:#fff}.hero p{color:#eaf4ff}.panel{background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:15px}.selector{display:grid;grid-template-columns:1fr;gap:9px}.selector label{display:grid;gap:5px;font-size:11px;font-weight:800}.selector select{padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text)}.summary{margin-top:10px;padding:11px;border-radius:9px;border-left:4px solid var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.report{padding:18px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:15px;text-align:left;cursor:pointer;min-height:112px;display:flex;justify-content:space-between;align-items:center;gap:15px}.report:nth-child(4n+1){box-shadow:inset 0 4px 0 var(--blue)}.report:nth-child(4n+2){box-shadow:inset 0 4px 0 var(--green)}.report:nth-child(4n+3){box-shadow:inset 0 4px 0 var(--yellow)}.report:nth-child(4n+4){box-shadow:inset 0 4px 0 #23b7d5}.report b{display:block;margin-bottom:7px;font-size:17px}.report span{font-size:12px;color:var(--muted)}.arrow{flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#0c7bea;color:#fff;font-size:28px;font-weight:900}@media(max-width:760px){.grid{grid-template-columns:1fr}}@media(max-width:520px){.shell{padding:11px}.report{min-height:105px;padding:16px}}</style></head><body><header class="topbar"><a href="/customer-workshop/?actor=customer">← Workshop</a><strong>PORTAL-CWM · GENERAL REPORT</strong></header><main class="shell"><section class="hero"><small>WORKSHOP REPORT CENTRE</small><h1 id="title">General Report</h1><p>Select a report. Each menu opens its own report-list page with record-level actions.</p></section><section class="panel"><div class="selector"><label>MACHINE<select id="machine"><option value="">Select machine…</option></select></label></div><div id="summary" class="summary">Select a machine, then open a report.</div></section><section class="panel"><div id="reports" class="grid"><button class="report" data-type="checklist"><div><b>Checklist Report</b><span>Completed machine checklists and safety results.</span></div><i class="arrow">›</i></button><button class="report" data-type="fuel"><div><b>Fuel Consumption Report</b><span>Fuel usage and consumption records.</span></div><i class="arrow">›</i></button><button class="report" data-type="operator"><div><b>Operator Report</b><span>Machine Operator reports and operating records.</span></div><i class="arrow">›</i></button><button class="report" data-type="technician"><div><b>Technician / Maintenance Report</b><span>Technician activity and maintenance work.</span></div><i class="arrow">›</i></button><button class="report" data-type="job-card"><div><b>Job Card Report</b><span>Opened, received, diagnosis, testing and completed work.</span></div><i class="arrow">›</i></button><button class="report" data-type="procurement"><div><b>Procurement Report</b><span>Spare Parts Purchase and procurement records.</span></div><i class="arrow">›</i></button><button class="report" data-type="store"><div><b>Store / Spare Parts Report</b><span>Store stock, issues, returns and spare movements.</span></div><i class="arrow">›</i></button><button class="report" data-type="service"><div><b>Service / Maintenance Report</b><span>Service intervals, due service and maintenance history.</span></div><i class="arrow">›</i></button><button class="report" data-type="breakdown"><div><b>Breakdown Report</b><span>Breakdown, diagnosis and repair history.</span></div><i class="arrow">›</i></button><button class="report" data-type="operator-checkup"><div><b>Operator Checkup Report</b><span>Daily operator machine checkup records.</span></div><i class="arrow">›</i></button></div></section></main><script>(function(){const token=localStorage.getItem('belm_customer_token')||'';if(!token){location.replace('/login');return}const $=x=>document.getElementById(x);let machines=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p){const r=await fetch('/api/customer-portal'+p,{cache:'no-store',headers:{Authorization:'Bearer '+token}}),t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{}if(!r.ok)throw Error(d?.error||'Request failed');return d}function current(){return machines.find(m=>String(m.id)===String($('machine').value))}function name(m){return[m?.brand,m?.model].filter(Boolean).join(' ')||m?.machineType||'Machine'}async function init(){try{const d=await api('/dashboard');machines=Array.isArray(d?.machines)?d.machines:[];$('title').textContent=(d?.customer?.name||'Customer')+' General Report';$('machine').innerHTML='<option value="">Select machine…</option>'+machines.map(m=>'<option value="'+esc(m.id)+'">'+esc(name(m))+(m.fleetNumber||m.fleet_number?' · '+esc(m.fleetNumber||m.fleet_number):'')+'</option>').join('');const wanted=new URLSearchParams(location.search).get('machine');if(wanted&&machines.some(m=>String(m.id)===wanted))$('machine').value=wanted}catch(e){$('summary').textContent=e.message}}$('machine').onchange=()=>{const m=current();$('summary').textContent=m?name(m)+' · Fleet: '+(m.fleetNumber||m.fleet_number||'—')+' · Serial: '+(m.serialNumber||m.serial_number||'—'):'Select a machine, then open a report.'};$('reports').onclick=e=>{const b=e.target.closest('[data-type]');if(!b)return;const m=current();if(!m){$('summary').textContent='Select a machine first.';$('machine').focus();return}location.href='/general-report/report/?type='+encodeURIComponent(b.dataset.type)+'&machine='+encodeURIComponent(m.id)};init()})();</script></body></html>
