<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operator Report — BELM</title><style>*{box-sizing:border-box}:root{--navy:#031a31;--blue:#0b63ce;--gold:#ffc21c;--green:#20c978}body{margin:0;min-height:100vh;padding:18px;background:linear-gradient(180deg,var(--blue),#063a86);color:#fff;font-family:Inter,system-ui,sans-serif}.sheet{width:min(850px,100%);margin:auto;background:var(--navy);border:1px solid var(--gold);border-radius:20px;padding:22px}.head{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #2b5878;padding-bottom:16px}.head small{color:var(--green);font-weight:900}.head h1{margin:5px 0}.head button,.tools button{border:1px solid var(--gold);border-radius:10px;padding:10px 14px;background:var(--gold);color:var(--navy);font-weight:900;cursor:pointer}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.meta div,.message{padding:14px;border:1px solid #2b5878;border-radius:12px;background:#08243d}.meta span{display:block;color:#9fb6ca;font-size:10px}.meta b{display:block;margin-top:5px}.message{white-space:pre-line;line-height:1.65}.tools{display:flex;gap:10px;margin-top:15px}.error{color:#ff8992}@media(max-width:560px){body{padding:9px}.sheet{padding:15px}.meta{grid-template-columns:1fr}.head{display:grid}}@media print{body{padding:0;background:#fff;color:#111}.sheet{border:0;background:#fff;width:100%}.head button,.tools{display:none}.meta div,.message{background:#fff;border-color:#ccc}}</style></head><body><main class="sheet"><header class="head"><div><small>BELM WORKSHOP PORTAL</small><h1 id="title">Operator Report</h1><span id="sub">Loading…</span></div><button onclick="history.back()">← Back</button></header><section class="meta"><div><span>DATE</span><b id="date">—</b></div><div><span>OPERATOR</span><b id="operator">—</b></div><div><span>STATUS</span><b id="status">—</b></div></section><section id="message" class="message">Loading report…</section><nav class="tools"><button onclick="print()">Print Report</button></nav></main><script>(async()=>{const q=new URLSearchParams(location.search),machine=q.get('machine')||'',record=q.get('record')||'',token=localStorage.getItem('belm_customer_token')||'',esc=v=>String(v??'');try{if(!token)throw Error('Customer login required.');const r=await fetch('/api/customer-portal/operator-reports/'+encodeURIComponent(machine),{cache:'no-store',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not load report.');const row=(Array.isArray(d)?d:[]).find(x=>String(x.id)===record);if(!row)throw Error('Operator Report was not found.');document.getElementById('title').textContent=esc(row.reportType||'Operator Report').replaceAll('_',' ');document.getElementById('sub').textContent='Checked machine record';document.getElementById('date').textContent=new Date(row.created_at).toLocaleString('en-GB',{timeZone:'Africa/Dar_es_Salaam',hour12:false});document.getElementById('operator').textContent=esc(row.operator_name||'Operator');document.getElementById('status').textContent=esc(row.status||'RECORDED');document.getElementById('message').textContent=esc(row.message||'No comment recorded.')}catch(e){document.getElementById('message').className='message error';document.getElementById('message').textContent=e.message}})();</script></body></html>
