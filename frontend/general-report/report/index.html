<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report List — PORTAL-CWM</title><link rel="stylesheet" href="/theme-global.css?v=632-report-pages"><script src="/theme-manager.js?v=632-report-pages"></script><style>*{box-sizing:border-box}:root{--bg:#f4f7fb;--panel:#fff;--line:#d7e1ec;--text:#14243a;--muted:#6f8194;--blue:#1677e8;--green:#13b866;--yellow:#f3c51d;--soft:#eef5fd}html[data-theme="dark"]{--bg:#061525;--panel:#0b1d31;--line:#244b69;--text:#f3f8fc;--muted:#9fb3c5;--soft:#0d2943}body{margin:0;background:var(--bg)!important;color:var(--text)!important;font-family:Inter,system-ui,sans-serif}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:#102a56;border-bottom:4px solid var(--yellow);color:#fff}.top a{color:#fff;text-decoration:none;font-weight:800}.shell{max-width:1180px;margin:auto;padding:18px}.hero{padding:19px;border-radius:18px;background:linear-gradient(135deg,#0d4fa3,#1278c9);color:#fff;border-bottom:5px solid var(--green);margin-bottom:15px}.hero p{margin:0;color:#cbe9ff;font-size:11px;font-weight:900;letter-spacing:.08em}.hero h1{margin:5px 0;color:#fff}.hero span{color:#eaf5ff}.toolbar,.panel{background:var(--panel)!important;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px}.toolbar{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.toolbar label{display:grid;gap:5px;font-size:10px;font-weight:900;min-width:220px}.toolbar select,.toolbar input{min-height:44px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:inherit}.toolbar button,.action,.open-main{min-height:42px;border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.blue{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.soft{background:var(--soft);color:var(--text);border:1px solid var(--line)!important}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.panel-head h2{margin:0}.count{font-size:11px;color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{background:var(--soft);font-size:10px;text-transform:uppercase;color:var(--muted)}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.row-actions button{border:0;border-radius:9px;padding:8px 10px;font-weight:850;cursor:pointer}.status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.status.green{background:#dff7e9;color:#147144}.status.yellow{background:#fff0b8;color:#765900}.status.red{background:#ffe2e5;color:#a32638}.empty{padding:24px;text-align:center;color:var(--muted)}.alert{padding:11px 13px;border-radius:10px;background:#ffe3e3;color:#9c2222;margin-bottom:12px}.hidden{display:none!important}dialog{border:0;border-radius:17px;width:min(760px,calc(100% - 24px));max-height:86%;padding:0;background:var(--panel);color:var(--text)}dialog::backdrop{background:#061525bb}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.modal-head button{border:0;background:var(--soft);color:var(--text);border-radius:9px;padding:8px 11px}.modal-body{padding:16px;overflow:auto}.answer{padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}.answer b{display:block}.answer span{color:var(--muted);font-size:11px}@media(max-width:620px){.shell{padding:11px}.toolbar{align-items:stretch}.toolbar label,.toolbar select,.toolbar input,.toolbar button{width:100%;min-width:0}.panel{padding:12px}.row-actions button{min-height:44px}.panel-head{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><a id="backLink" href="/general-report/">← General Report</a><strong>PORTAL-CWM · REPORT LIST</strong></header><main class="shell"><section class="hero"><p>WORKSHOP REPORT</p><h1 id="pageTitle">Report</h1><span id="machineTitle">Loading machine…</span></section><div id="alert" class="alert hidden"></div><section class="toolbar"><label>MACHINE<select id="machine"><option value="">Select machine…</option></select></label><label>FROM<input id="from" type="date"></label><label>TO<input id="to" type="date"></label><button id="refresh" class="soft" type="button">Refresh</button><button id="csv" class="green" type="button">Download List CSV</button><button id="print" class="blue" type="button">Print List</button><a id="openMain" class="open-main soft hidden" href="#">Open Full Module</a></section><section class="panel"><div class="panel-head"><div><h2 id="listTitle">Records</h2><div id="count" class="count">0 records</div></div></div><div class="tablewrap"><table id="table"><thead><tr id="head"></tr></thead><tbody id="body"><tr><td class="empty">Loading…</td></tr></tbody></table></div></section></main><dialog id="viewDialog"><div class="modal-head"><strong id="viewTitle">Report details</strong><button id="closeView" type="button">Close</button></div><div id="viewBody" class="modal-body"></div></dialog><script>(function(){const token=localStorage.getItem('belm_customer_token')||'';if(!token){location.replace('/login');return}const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),type=p.get('type')||'checklist';let machines=[],rows=[],cols=[];const labels={checklist:'Checklist Report',fuel:'Fuel Consumption Report',operator:'Operator Report',technician:'Technician / Maintenance Report','job-card':'Job Card Report',procurement:'Procurement Report',store:'Store / Spare Parts Report',service:'Service / Maintenance Report',breakdown:'Breakdown Report','operator-checkup':'Operator Checkup Report'};const moduleLinks={fuel:'/customer-fuel-usage/',operator:'/operator/?report=1',procurement:'/customer-procurement/',store:'/customer-store/'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){const r=await fetch('/api/customer-portal'+path,{...opt,cache:'no-store',headers:{Authorization:'Bearer '+token,...(opt.headers||{})}}),t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{}if(!r.ok)throw Error(d?.error||`Request failed (${r.status})`);return d}function current(){return machines.find(m=>String(m.id)===String($('machine').value))}function machineName(m){return [m?.brand,m?.model].filter(Boolean).join(' ')||m?.machineType||m?.machine_type||'Machine'}function inRange(date){const day=String(date||'').slice(0,10),f=$('from').value,t=$('to').value;return(!f||day>=f)&&(!t||day<=t)}function badge(v){const s=String(v||'').toUpperCase(),c=s.includes('RED')?'red':s.includes('YELLOW')?'yellow':'green';return `<span class="status ${c}">${esc(v||'—')}</span>`}function render(){const h=cols.map(c=>`<th>${esc(c.label)}</th>`).join('')+'<th>Actions</th>';$('head').innerHTML=h;$('body').innerHTML=rows.length?rows.map((r,i)=>'<tr>'+cols.map(c=>`<td>${c.html?c.html(r):esc(r[c.key]??'—')}</td>`).join('')+`<td><div class="row-actions">${actions(r,i)}</div></td></tr>`).join(''):`<tr><td colspan="${cols.length+1}" class="empty">No records found.</td></tr>`;$('count').textContent=`${rows.length} record${rows.length===1?'':'s'}`}function actions(r){if(type==='checklist')return `<button class="soft" data-view="${esc(r.id)}">View</button><button class="blue" data-download="${esc(r.id)}">Download PDF</button>`;if(['job-card','breakdown','technician','service'].includes(type))return `<button class="soft" data-job="${esc(r.id||'')}">Open Job Card</button>`;return moduleLinks[type]?`<button class="soft" data-module="1">Open Full Report</button>`:''}async function load(){const m=current();if(!m)return;rows=[];cols=[];$('machineTitle').textContent=`${machineName(m)} · Fleet ${m.fleetNumber||m.fleet_number||'—'}`;$('listTitle').textContent=labels[type]||'Report';$('body').innerHTML='<tr><td class="empty">Loading…</td></tr>';try{if(type==='checklist'){const d=await api('/machines/'+encodeURIComponent(m.id)+'/reports');rows=(Array.isArray(d)?d:[]).filter(r=>inRange(r.createdAt||r.created_at)).map(r=>({id:r.id,date:String(r.createdAt||r.created_at||'').slice(0,10),checklist:r.templateName||r.template_name||'Checklist',status:r.overallStatus||r.overall_status||'—',by:r.filledBy||r.filled_by||'—',hours:r.hourMeterReading||r.hour_meter_reading||'—'}));cols=[{key:'date',label:'Date'},{key:'checklist',label:'Checklist'},{key:'status',label:'Status',html:r=>badge(r.status)},{key:'by',label:'Filled By'},{key:'hours',label:'Hour Meter'}];render();return}if(['job-card','breakdown','technician','service'].includes(type)){const d=await api('/machines/'+encodeURIComponent(m.id)+'/job-cards');rows=(Array.isArray(d)?d:[]).filter(r=>inRange(r.created_at||r.createdAt)).map(r=>({id:r.id,date:String(r.created_at||r.createdAt||'').slice(0,10),no:r.job_card_no||r.jobCardNo||'—',work:r.title||r.problem||r.description||'—',status:r.status||'—',tech:r.technician_name||r.technicianName||'—'}));cols=[{key:'date',label:'Date'},{key:'no',label:'Job Card'},{key:'work',label:type==='breakdown'?'Breakdown / Diagnosis':'Work / Service'},{key:'status',label:'Status'},{key:'tech',label:'Technician'}];render();return}cols=[{key:'info',label:'Report'}];rows=[];render();$('openMain').classList.toggle('hidden',!moduleLinks[type]);if(moduleLinks[type])$('openMain').href=moduleLinks[type]+(moduleLinks[type].includes('?')?'&':'?')+'machine='+encodeURIComponent(m.id)}catch(e){$('alert').textContent=e.message;$('alert').classList.remove('hidden');$('body').innerHTML='<tr><td class="empty">Could not load records.</td></tr>'}}async function viewChecklist(id){try{const d=await api('/reports/'+encodeURIComponent(id)+'/view');$('viewTitle').textContent=`${d.templateName||d.template_name||'Checklist'} · ${String(d.createdAt||d.created_at||'').slice(0,10)}`;const answers=Array.isArray(d.answers)?d.answers:[];$('viewBody').innerHTML=`<p><b>Status:</b> ${esc(d.overallStatus||d.overall_status||'—')} · <b>Filled by:</b> ${esc(d.filledBy||d.filled_by||'—')}</p>`+(answers.length?answers.map(a=>`<div class="answer"><b>${esc(a.itemLabel||a.item_label||a.label||'Checklist item')}</b><span>${esc(a.answer||a.value||a.result||'—')}</span></div>`).join(''):'<div class="empty">No answers recorded.</div>');$('viewDialog').showModal()}catch(e){alert(e.message)}}async function downloadChecklist(id){const r=await fetch('/api/customer-portal/reports/'+encodeURIComponent(id)+'/download',{cache:'no-store',headers:{Authorization:'Bearer '+token}});if(!r.ok){let m='Could not download PDF.';try{const d=await r.json();m=d.error||m}catch{}return alert(m)}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Checklist-Report-'+id+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function csv(){if(!rows.length)return alert('No records to download.');const data=[cols.map(c=>c.label),...rows.map(r=>cols.map(c=>r[c.key]??''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=(labels[type]||'report').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function init(){try{const d=await api('/dashboard');machines=Array.isArray(d?.machines)?d.machines:[];$('pageTitle').textContent=labels[type]||'Report';$('machine').innerHTML='<option value="">Select machine…</option>'+machines.map(m=>`<option value="${esc(m.id)}">${esc(machineName(m))}${m.fleetNumber||m.fleet_number?' · '+esc(m.fleetNumber||m.fleet_number):''}</option>`).join('');const wanted=p.get('machine');if(wanted&&machines.some(m=>String(m.id)===wanted))$('machine').value=wanted;else if(machines.length===1)$('machine').value=machines[0].id;if($('machine').value)load()}catch(e){$('alert').textContent=e.message;$('alert').classList.remove('hidden')}}$('machine').onchange=load;$('from').onchange=load;$('to').onchange=load;$('refresh').onclick=load;$('csv').onclick=csv;$('print').onclick=()=>print();$('closeView').onclick=()=>$('viewDialog').close();$('body').onclick=e=>{const v=e.target.closest('[data-view]'),d=e.target.closest('[data-download]'),j=e.target.closest('[data-job]'),mod=e.target.closest('[data-module]');if(v)viewChecklist(v.dataset.view);else if(d)downloadChecklist(d.dataset.download);else if(j){const m=current();location.href='/customer-job-card/?machine='+encodeURIComponent(m?.id||'')+(j.dataset.job?'&jobCard='+encodeURIComponent(j.dataset.job):'')}else if(mod)$('openMain').click()};init()})();</script></body></html>
