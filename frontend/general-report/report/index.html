</style></head><body><header class="top"><a href="/general-report/">← General Report</a><strong>BELM WORKSHOP PORTAL · REPORT</strong></header><main class="shell"><section class="hero"><small>GENERAL REPORT</small><h1 id="title">Report</h1><span id="machineTitle">Select machine and date range.</span></section><div id="alert" class="alert hidden"></div><section class="toolbar"><label>MACHINE<select id="machine"><option value="">Select machine…</option></select></label><label>FROM (DD/MM/YY)<input id="from" type="date"></label><label>TO (DD/MM/YY)<input id="to" type="date"></label><button id="refresh" type="button">Refresh</button><button id="print" class="gold" type="button">Print</button><button id="pdf" class="gold" type="button">Download PDF</button><button id="csv" class="green" type="button">CSV File</button></section><section class="panel"><div class="panel-head"><div><h2 id="listTitle">Records</h2><span id="count">0 records</span></div></div><div class="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="body"><tr><td class="empty">Loading…</td></tr></tbody></table></div></section></main>
<script>
(function(){
 const token=localStorage.getItem('belm_customer_token')||'';if(!token){location.replace('/login');return}const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),type=q.get('type')||'checklist';let machines=[],rows=[],columns=[];
 const labels={checklist:'Checklist Report',fuel:'Fuel Report',operator:'Operator Report','operator-checkup':'Operator Checkup Report',technician:'Maintenance Report','job-card':'Job Card Report',service:'Maintenance Report',breakdown:'Breakdown Report',procurement:'Procurement Report',store:'Store / Spare Parts Report'};
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path){const r=await fetch('/api/customer-portal'+path,{cache:'no-store',headers:{Authorization:'Bearer '+token}}),t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(_){}if(!r.ok)throw Error(d?.error||`Request failed (${r.status})`);return d}
 const current=()=>machines.find(m=>String(m.id)===String($('machine').value)),machineName=m=>[m?.brand,m?.model].filter(Boolean).join(' ')||m?.machineType||m?.machine_type||'Machine',day=v=>String(v||'').slice(0,10),inRange=v=>(!$('from').value||day(v)>=$('from').value)&&(!$('to').value||day(v)<=$('to').value);function dateQuery(){const p=new URLSearchParams();if($('from').value)p.set('from',$('from').value);if($('to').value)p.set('to',$('to').value);return p}
 function draw(){ $('head').innerHTML=columns.map(c=>`<th>${esc(c.label)}</th>`).join('')+'<th>Action</th>';$('body').innerHTML=rows.length?rows.map((r,index)=>`<tr>${columns.map(c=>`<td>${esc(r[c.key]??'—')}</td>`).join('')}<td><div class="action-tools"><button class="view" type="button" data-url="${esc(r.url||'')}">View Report</button>${r.rowDownloads?`<button class="row-action" type="button" data-row-print="${index}">Print</button><button class="row-action pdf" type="button" data-row-pdf="${index}">PDF</button><button class="row-action csv" type="button" data-row-csv="${index}">CSV</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="${columns.length+1}" class="empty">No records found for selected dates.</td></tr>`;$('count').textContent=`${rows.length} record${rows.length===1?'':'s'} · newest first` }
 async function load(){const m=current();if(!m)return;$('alert').classList.add('hidden');$('machineTitle').textContent=`${machineName(m)} · Fleet ${m.fleetNumber||m.fleet_number||'—'}`;$('listTitle').textContent=labels[type]||'Report';$('body').innerHTML='<tr><td class="empty">Loading…</td></tr>';try{
  if(type==='checklist'){const d=await api(`/machines/${encodeURIComponent(m.id)}/reports`);rows=(Array.isArray(d)?d:[]).filter(r=>inRange(r.createdAt||r.created_at)).map(r=>({id:r.id,date:day(r.createdAt||r.created_at),name:r.templateName||r.template_name||'Checklist',status:r.overallStatus||r.overall_status||'—',by:r.filledBy||r.filled_by||'—',hours:r.hourMeterReading??r.hour_meter_reading??'—',url:`/tech-checked-report/?machineId=${encodeURIComponent(m.id)}&reportId=${encodeURIComponent(r.id)}&source=customer`,pdfUrl:`/api/customer-portal/reports/${encodeURIComponent(r.id)}/download`,rowDownloads:true}));columns=[{key:'date',label:'Date'},{key:'name',label:'Checked Report'},{key:'status',label:'Status'},{key:'by',label:'Filled By'},{key:'hours',label:'Hour Meter'}];draw();return}
  if(type==='fuel'){const d=await api(`/fuel-usage/${encodeURIComponent(m.id)}?${dateQuery()}`);rows=(d.entries||[]).map(r=>({id:r.id,date:r.date,litres:r.quantity,price:r.unit_price,total:r.cost,by:r.logged_by,url:`/customer-fuel-usage/?machine=${encodeURIComponent(m.id)}&record=${encodeURIComponent(r.id)}`,rowDownloads:true}));columns=[{key:'date',label:'Date'},{key:'litres',label:'Litres'},{key:'price',label:'Price / Litre'},{key:'total',label:'Total TZS'},{key:'by',label:'Recorded By'}];draw();return}
  if(type==='operator'||type==='operator-checkup'){const d=await api(`/operator-reports/${encodeURIComponent(m.id)}?${dateQuery()}`);rows=(Array.isArray(d)?d:[]).filter(r=>type!=='operator-checkup'||String(r.reportType||'').toUpperCase()==='CHECKUP').map(r=>({id:r.id,date:day(r.created_at),kind:r.reportType||'OPERATOR',by:r.operator_name||'Operator',message:r.message,status:r.status,url:`/general-report/record/?machine=${encodeURIComponent(m.id)}&record=${encodeURIComponent(r.id)}&type=operator`,rowDownloads:true}));columns=[{key:'date',label:'Date'},{key:'kind',label:'Report Type'},{key:'by',label:'Operator'},{key:'message',label:'Report'},{key:'status',label:'Status'}];draw();return}
  if(type==='procurement'){const d=await api(`/procurement-requests/${encodeURIComponent(m.id)}`);rows=(d.items||[]).filter(r=>inRange(r.createdAt||r.created_at)).map(r=>({id:r.id,date:day(r.createdAt||r.created_at),ref:r.referenceNumber||r.reference_number||'—',item:r.description||'Spare',qty:r.quantity,status:r.status,url:`/customer-procurement/?machine=${encodeURIComponent(m.id)}&request=${encodeURIComponent(r.id)}`,rowDownloads:true}));columns=[{key:'date',label:'Date'},{key:'ref',label:'Reference'},{key:'item',label:'Item'},{key:'qty',label:'Quantity'},{key:'status',label:'Status'}];draw();return}
  if(type==='store'){rows=[{id:'store-summary',name:'Store and Spare Parts',description:'Open machine store movements and spare-part records.',url:`/customer-store/?machine=${encodeURIComponent(m.id)}`,rowDownloads:true}];columns=[{key:'name',label:'Report'},{key:'description',label:'Details'}];draw();return}
  const category=type==='job-card'?'JOB_CARD':'ALL',d=await api(`/machines/${encodeURIComponent(m.id)}/report-records?category=${category}&${dateQuery()}`);rows=(Array.isArray(d)?d:[]).filter(r=>type!=='breakdown'||String(r.status||'').toUpperCase()!=='COMPLETED').map(r=>({id:r.recordId||r.sourceId||r.jobCardId,date:day(r.occurredAt),no:r.jobCardNo||'—',work:r.title||r.message||'—',status:r.status||'—',tech:r.technicianName||r.reportedBy||'—',url:r.jobCardId?`/customer-job-card/?machine=${encodeURIComponent(m.id)}&jobCard=${encodeURIComponent(r.jobCardId)}`:`/general-report/?machine=${encodeURIComponent(m.id)}`,rowDownloads:true}));columns=[{key:'date',label:'Date'},{key:'no',label:'Job Card'},{key:'work',label:'Work / Maintenance'},{key:'status',label:'Status'},{key:'tech',label:'Technician'}];draw()
 }catch(e){$('alert').textContent=e.message;$('alert').classList.remove('hidden');rows=[];columns=[{key:'message',label:'Report'}];draw()}}
 function downloadUrl(){const m=current();if(!m)return'';const p=dateQuery();if(type==='fuel')return `/api/customer-portal/fuel-usage/${encodeURIComponent(m.id)}/pdf?${p}`;if(type==='operator'||type==='operator-checkup'){if(type==='operator-checkup')p.set('type','CHECKUP');return `/api/customer-portal/operator-reports/${encodeURIComponent(m.id)}/pdf?${p}`}if(type==='checklist')return `/api/customer-portal/machines/${encodeURIComponent(m.id)}/reports-pdf?${p}`;p.set('category',type==='job-card'?'JOB_CARD':'ALL');return `/api/customer-portal/machines/${encodeURIComponent(m.id)}/report-records-pdf?${p}`}
 async function downloadPdf(){const u=downloadUrl();if(!u)return;const r=await fetch(u,{headers:{Authorization:'Bearer '+token}});if(!r.ok)return alert('Could not download report.');saveBlob(await r.blob(),(labels[type]||'report')+'.pdf')}function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function safeName(row,ext){return `${(labels[type]||'report').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-${row?.date||row?.id||'record'}.${ext}`}function csv(){if(!rows.length)return alert('No records to download.');saveCsv(rows,(labels[type]||'report').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.csv')}function saveCsv(data,name){const content=[columns.map(c=>c.label),...data.map(r=>columns.map(c=>r[c.key]??''))].map(line=>line.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');saveBlob(new Blob([content],{type:'text/csv;charset=utf-8'}),name)}function rowLines(row){return [labels[type]||'BELM Report',$('machineTitle').textContent,...columns.map(c=>`${c.label}: ${row?.[c.key]??'—'}`)]}function pdfText(value){return String(value??'').normalize('NFKD').replace(/[^\x20-\x7E]/g,' ').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}function simpleRowPdf(row){const lines=rowLines(row).flatMap(line=>{const text=pdfText(line);return text.length>82?(text.match(/.{1,82}(?:\s|$)/g)||[text]):[text]}),stream=['BT','/F1 18 Tf','50 790 Td',`(${pdfText(lines.shift()||'BELM REPORT')}) Tj`,'/F1 11 Tf',...lines.map(line=>`0 -22 Td (${pdfText(line.trim())}) Tj`),'ET'].join('\n'),objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>`,`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((object,index)=>{offsets.push(new TextEncoder().encode(pdf).length);pdf+=`${index+1} 0 obj\n${object}\nendobj\n`});const xref=new TextEncoder().encode(pdf).length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(value=>String(value).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;saveBlob(new Blob([pdf],{type:'application/pdf'}),safeName(row,'pdf'))}async function rowPdf(row){if(!row)return;if(!row.pdfUrl){simpleRowPdf(row);return}const response=await fetch(row.pdfUrl,{headers:{Authorization:'Bearer '+token}});if(!response.ok)return alert('Could not download this report.');saveBlob(await response.blob(),safeName(row,'pdf'))}function rowPrint(row){if(!row)return;const values=columns.map(c=>`<div><span>${esc(c.label)}</span><b>${esc(row[c.key]??'—')}</b></div>`).join(''),page=window.open('','_blank');if(!page)return;page.document.write(`<!doctype html><title>${esc(labels[type]||'BELM Report')}</title><style>body{font-family:Arial,sans-serif;margin:35px;color:#10233f}header{border-bottom:5px solid #ffc21c;padding-bottom:16px}small{color:#0b63ce;font-weight:900}h1{margin:5px 0}.machine{color:#52677a}.grid{display:grid;gap:10px;margin-top:22px}.grid div{padding:14px;border:1px solid #ccd9e5;border-left:5px solid #20c978}.grid span{display:block;font-size:10px;color:#63788b}.grid b{display:block;margin-top:5px;white-space:pre-wrap}@media print{body{margin:18mm}}</style><header><small>BELM GENERAL TECH SERVICE LTD</small><h1>${esc(labels[type]||'Report')}</h1><div class="machine">${esc($('machineTitle').textContent)}</div></header><section class="grid">${values}</section>`);page.document.close();setTimeout(()=>page.print(),250)}
 async function init(){try{const d=await api('/dashboard');machines=Array.isArray(d?.machines)?d.machines:[];$('title').textContent=labels[type]||'Report';$('machine').innerHTML='<option value="">Select machine…</option>'+machines.map(m=>`<option value="${esc(m.id)}">${esc(machineName(m))} · ${esc(m.fleetNumber||m.fleet_number||'—')}</option>`).join('');const wanted=q.get('machine');if(wanted&&machines.some(m=>String(m.id)===wanted))$('machine').value=wanted;else if(machines.length===1)$('machine').value=machines[0].id;if($('machine').value)load()}catch(e){$('alert').textContent=e.message;$('alert').classList.remove('hidden')}}$('machine').onchange=load;$('from').onchange=load;$('to').onchange=load;$('refresh').onclick=load;$('print').onclick=()=>print();$('csv').onclick=csv;$('pdf').onclick=downloadPdf;$('body').onclick=e=>{const view=e.target.closest('[data-url]');if(view?.dataset.url){window.open(view.dataset.url,'_blank','noopener');return}const printButton=e.target.closest('[data-row-print]'),pdfButton=e.target.closest('[data-row-pdf]'),csvButton=e.target.closest('[data-row-csv]');if(printButton)rowPrint(rows[Number(printButton.dataset.rowPrint)]);if(pdfButton)rowPdf(rows[Number(pdfButton.dataset.rowPdf)]);if(csvButton){const row=rows[Number(csvButton.dataset.rowCsv)];if(row)saveCsv([row],safeName(row,'csv'))}};init()
})();
