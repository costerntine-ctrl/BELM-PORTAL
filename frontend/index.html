    <script>
      /* V525 — Customer CWM is now the customer main dashboard.
         Keep /portal/dashboard?view=machines and other explicit subviews alive,
         but retire the old customer dashboard home shown at bare /portal/dashboard. */
      (function () {
        try {
          var isCustomer = !!localStorage.getItem('belm_customer_token');
          var isCustomerHome = location.pathname === '/portal/dashboard' || location.pathname === '/portal/dashboard/';
          var params = new URLSearchParams(location.search);
          var hasExplicitSubview = params.has('view') || params.has('action') || params.has('machine') || params.has('machineId');
          if (isCustomer && isCustomerHome && !hasExplicitSubview) {
            location.replace('/customer-workshop/?actor=customer');
          }
        } catch (_) {}
      })();
    </script>

  <script>
    // V256 - registers the same service worker the old customer-app.html
    // shell already used, but from THIS shared shell instead - the one
    // that actually serves /admin/login, /portal/dashboard, and /tech.
    // A manifest alone (V249) is not enough for a browser to offer
    // "Install app" / "Add to Home screen" as a real standalone app; an
    // active, controlling service worker is one of the installability
    // requirements too, and nothing here was ever registering one.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/belm-sw.js').catch(() => {}));
