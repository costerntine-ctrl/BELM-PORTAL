<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>BELM Invoice List</title>
  <link rel="stylesheet" href="/theme-global.css?v=485-display-fit">
  <script src="/theme-manager.js?v=485-display-fit"></script>
  <link rel="stylesheet" href="/invoice-manager/invoice.css?v=3">
</head>
<body>
  <header class="invoice-topbar">
    <a class="invoice-brand" href="/concept-dashboards/09-finance-accounts/">
      <span class="invoice-brand-mark">B</span>
      <span><strong>BELM</strong><small>Invoice List</small></span>
    </a>
    <div class="invoice-top-actions">
      <a class="top-btn" href="/concept-dashboards/09-finance-accounts/">← Finance Dashboard</a>
      <a class="top-btn" href="/proforma-manager/">Proforma</a>
      <button id="refreshButton" class="top-btn" type="button">Refresh</button>
      <button id="logoutButton" class="top-btn" type="button">Log out</button>
    </div>
  </header>

  <main class="invoice-page">
    <section class="invoice-titlebar">
      <div>
        <p>ACCOUNTING &amp; BILLING</p>
        <h1>Invoice List</h1>
        <span>Invoices are generated automatically from Proforma. No manual Invoice creation.</span>
      </div>
      <div class="invoice-title-actions">
        <a class="primary-btn" href="/proforma-manager/">+ Create Proforma</a>
      </div>
    </section>

    <div id="pageAlert" class="page-alert hidden" role="status"></div>

    <section class="invoice-list-card invoice-list-only">
      <div class="list-head">
        <div><p>GENERATED INVOICES</p><h2>Invoice List</h2></div>
        <div class="list-tools">
          <input id="invoiceSearch" type="search" placeholder="Search invoice / customer…">
          <span id="invoiceCount" class="count-badge">0</span>
        </div>
      </div>

      <div class="invoice-table-wrap">
        <table class="invoice-table">
          <thead><tr><th>#</th><th>Invoice</th><th>Source Proforma</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="invoiceRows"><tr><td colspan="8" class="empty-row">Loading invoices…</td></tr></tbody>
        </table>
      </div>

      <div class="pagination">
        <button id="prevPage" class="small-btn" type="button">← Previous</button>
        <span id="pageLabel">Page 1</span>
        <button id="nextPage" class="small-btn" type="button">Next →</button>
      </div>
    </section>
  </main>

  <script src="/delete-confirm.js"></script>
  <script src="/invoice-manager/invoice.js?v=3"></script>
</body>
</html>
