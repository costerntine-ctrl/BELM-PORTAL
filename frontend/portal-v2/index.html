<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d57b3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>BELM Workshop Portal</title>
  <link rel="icon" type="image/png" href="/app-icon-192.png">
  <link rel="apple-touch-icon" href="/app-icon-192.png">
  <link rel="manifest" href="/belm-app.webmanifest">
  <link rel="stylesheet" href="/portal-v2/landing.css?v=730-shared-home">
</head>
<body>
  <div id="navCurtain" class="belm-nav-curtain" aria-hidden="true"><span>OPENING <b>YOUR WORKSPACE</b>…</span></div>
  <main class="landing-shell">
    <section class="landing-hero">
      <div class="welcome-line"><span></span><b>WELCOME TO</b><span></span></div>
      <h1><strong>BELM</strong> <em>WORKSHOP</em> <strong>PORTAL</strong></h1>

      <div class="contact-row" aria-label="BELM contact information">
        <div class="contact-item"><span class="contact-icon address">●</span><div><small>ADDRESS</small><strong>TEMEKE</strong></div></div>
        <div class="contact-item"><span class="contact-icon mail">✉</span><div><small>EMAIL</small><strong>info@belmgeneral.co.tz</strong></div></div>
        <div class="contact-item"><span class="contact-icon phone">☎</span><div><small>PHONE</small><strong>+255 713 309 529</strong></div></div>
      </div>

      <section class="alert-panel" aria-live="polite">
        <div class="alert-kicker">⚠ MACHINE ALERTS</div>
        <button id="prevAlert" class="alert-arrow left" type="button" aria-label="Previous machine alert">‹</button>
        <div id="alertContent" class="alert-content" hidden>
          <h2 id="machineTitle">Machine</h2>
          <p id="machineStatus">Machine status: —</p>
          <strong id="machineNote">—</strong>
        </div>
        <div id="alertEmpty" class="alert-empty">Checking machine alerts…</div>
        <button id="nextAlert" class="alert-arrow right" type="button" aria-label="Next machine alert">›</button>
        <div id="alertDots" class="alert-dots" aria-label="Machine alert selector"></div>
      </section>

      <button id="viewRoleButton" class="role-button" type="button">
        <span class="role-mark">◎</span>
        <span class="role-copy"><small id="roleLabel">YOUR ROLE</small><strong>VIEW MY ROLE</strong><em id="roleSubtitle">Open your assigned dashboard</em></span>
        <span class="role-arrow">→</span>
      </button>

      <button id="logoutButton" class="logout-link" type="button">Log out / Use another account</button>
    </section>
  </main>
  <script src="/portal-v2/landing.js?v=730-shared-home"></script>
</body>
</html>
