<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Role Communication — BELM Operations</title><link rel="stylesheet" href="/theme-global.css?v=763-role-flow"><script src="/theme-manager.js?v=763-role-flow"></script><script src="/navigation-context-v763.js?v=763-role-flow"></script><style>
*{box-sizing:border-box}:root{--navy:#071b2e;--panel:#0d2945;--panel2:#123655;--line:#2a5575;--text:#f4f8fc;--muted:#a4b8c9;--blue:#2284db;--green:#24bf79;--yellow:#f2c420;--red:#ef6262}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#061525,#091e33);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;background:#0b2a4e;border-bottom:3px solid var(--yellow)}.top small{display:block;color:#65e89a;font-weight:900;letter-spacing:.1em}.top h1{margin:2px 0 0;font-size:20px}.top button{border:1px solid #467191;border-radius:9px;background:#0c3558;color:#fff;padding:9px 13px;font-weight:800;cursor:pointer}.shell{width:min(1320px,calc(100% - 24px));margin:auto;padding:20px 0 45px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:15px}.hero h2{margin:0 0 5px;font-size:28px}.hero p{margin:0;color:var(--muted)}.role-chip{display:inline-flex;padding:7px 10px;border-radius:999px;background:#113c5e;border:1px solid #36719c;color:#dcebfa;font-size:10px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat,.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:15px}.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:11px}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.75fr);gap:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button{border:1px solid var(--line);background:#102f4d;color:#d8e6f2;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.toolbar button.active{background:var(--blue);border-color:var(--blue);color:#fff}.messages{display:grid;gap:9px}.msg{border:1px solid var(--line);background:#0c2741;border-radius:12px;padding:13px;cursor:pointer}.msg.unread{box-shadow:inset 4px 0 0 var(--blue)}.msg.urgent{border-color:#b64a4a}.msg.attention{border-color:#aa8a21}.msg-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.msg h3{margin:3px 0 6px;font-size:14px}.msg p{margin:0;color:#cedae5;line-height:1.5;font-size:12.5px;white-space:pre-wrap}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:10.5px}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;background:#173c59;color:#cde3f5;font-weight:850}.badge.urgent{background:#51252a;color:#ffc5c5}.badge.attention{background:#4a3e16;color:#ffe889}.compose h3{margin:0 0 12px}.compose label{display:grid;gap:5px;color:#b7c8d8;font-size:11px;font-weight:800;margin-bottom:10px}.compose input,.compose select,.compose textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#081f35;color:#fff;padding:10px;font:inherit}.compose textarea{min-height:150px;resize:vertical}.send{width:100%;border:0;border-radius:10px;padding:11px;background:var(--green);color:#052416;font-weight:950;cursor:pointer}.notice{margin-bottom:12px;padding:10px 12px;border:1px solid #497393;border-radius:10px;background:#0f3150;color:#dbe9f5}.notice.error{border-color:#a64d4d;background:#3b2024;color:#ffcece}.hidden{display:none!important}.empty{padding:35px 15px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.open-link{display:inline-flex;margin-top:9px;color:#8dc5ff;font-size:11px;font-weight:850;text-decoration:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.stats{grid-template-columns:1fr}.shell{width:min(100% - 14px,1320px)}.top{align-items:flex-start}.hero h2{font-size:23px}}
</style></head><body><header class="top"><div><small>ROLE-TO-ROLE WORKFLOW</small><h1>Communication Inbox</h1></div><button id="refresh" type="button">↻ Refresh</button></header><main class="shell"><section class="hero"><div><h2>Operational Communication</h2><p>Messages are routed to roles, not exposed across unrelated departments or customer companies.</p></div><span class="role-chip" id="actor">Loading role…</span></section><div id="notice" class="notice hidden"></div><section class="stats"><article class="stat"><b id="inboxCount">0</b><span>Inbox</span></article><article class="stat"><b id="unreadCount">0</b><span>Unread</span></article><article class="stat"><b id="urgentCount">0</b><span>Urgent</span></article><article class="stat"><b id="sentCount">0</b><span>Sent by me</span></article></section><section class="layout"><article class="card"><div class="toolbar" id="filters"><button class="active" data-filter="inbox">Inbox</button><button data-filter="unread">Unread</button><button data-filter="urgent">Urgent</button><button data-filter="sent">Sent</button><button data-filter="all">All</button></div><div id="messages" class="messages"><div class="empty">Loading messages…</div></div></article><aside class="card compose"><h3>Send Role Message</h3><form id="compose"><label>Send to role<select id="recipient" required><option value="">Loading roles…</option></select></label><label id="customerLabel" class="hidden">Customer company<select id="customer"><option value="">Select customer…</option></select></label><label>Priority<select id="priority"><option value="NORMAL">Normal</option><option value="ATTENTION">Attention</option><option value="URGENT">Urgent</option></select></label><label>Subject<input id="subject" maxlength="180" placeholder="Example: Spare request status"></label><label>Message<textarea id="message" maxlength="2500" required placeholder="Write the operational message…"></textarea></label><button class="send" type="submit">Send Message</button></form></aside></section></main><script src="/role-communications/app.js?v=763-role-flow"></script></body></html>
