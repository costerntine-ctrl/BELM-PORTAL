<!doctype html><html lang="en"><head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BELM Checked Report</title><meta name="theme-color" content="#071426"><style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#fff;font-family:Inter,Arial,sans-serif}.shell{width:min(1000px,calc(100% - 24px));margin:18px auto 50px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px;border:1px solid #174160;border-radius:16px;background:#03162a}.head small{color:#18a9f4;font-weight:900}.head h1{margin:5px 0;font-size:clamp(20px,4vw,30px)}.head p{margin:0;color:#9fb0c8}.back,.tools button{padding:10px 13px;border:1px solid #1684ff;border-radius:9px;background:#0d4fa3;color:#fff;font-weight:900;cursor:pointer}.back{background:#04172a;border-color:#315675}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.meta div{padding:13px;border:1px solid #174160;border-radius:12px;background:#04172a}.meta span{display:block;color:#8fa6bd;font-size:10px;text-transform:uppercase}.meta b{display:block;margin-top:5px}.tools{display:flex;justify-content:flex-end;gap:8px;margin:14px 0}.tools button:last-child{border-color:#12b83f;background:#087b43}.items{display:grid;gap:10px}.item{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(110px,.6fr);gap:12px;padding:14px;border:1px solid #174160;border-left:6px solid #8190a4;border-radius:12px;background:#04172a}.item.green{border-left-color:#12c44b}.item.yellow{border-left-color:#f6b500}.item.red{border-left-color:#ff2638}.item small{color:#8fa6bd}.item strong{display:block;margin-top:5px}.answer{text-align:right}.answer b{color:#fff}.issue-text{display:block;margin-top:7px;color:#ffcf4a!important;font-size:13px!important;font-weight:900}.photo{grid-column:1/-1;max-width:100%;max-height:480px;border-radius:10px;border:1px solid #315675}.error,.empty{padding:22px;border:1px solid #174160;border-radius:12px;background:#04172a;color:#aebdce}@media(max-width:650px){.head{flex-direction:column-reverse}.meta{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr}.answer{text-align:left}.tools{display:grid;grid-template-columns:1fr 1fr}}@media print{body{background:#fff;color:#111}.shell{width:100%;margin:0}.back,.tools{display:none}.head,.meta div,.item{background:#fff;color:#111;border-color:#bbb}.head p,.item small,.meta span{color:#444}.answer b{color:#111}}

</style><style id="belm-brand-v673">
:root{--belm-blue:#0b63ce;--belm-blue-mid:#0755ba;--belm-blue-deep:#063a86;--belm-navy:#031a31;--belm-gold:#ffc21c;--belm-green:#20c978}

</style></head><body><main class="shell"><header class="head"><div><small id="report-owner">BELM TECHNICIAN · CHECKED REPORT</small><h1 id="title">Loading checked report…</h1><p id="sub">Please wait</p></div><button class="back" onclick="history.back()">← Back</button></header><section class="meta"><div><span>Checklist No.</span><b id="number">—</b></div><div><span>Date Checked</span><b id="date">—</b></div><div><span>Technician</span><b id="tech">—</b></div><div><span>Hour Meter</span><b id="hours">—</b></div></section><nav class="tools"><button onclick="print()">Print</button><button id="pdf">Download PDF</button></nav><section id="items" class="items"><p class="empty">Loading checklist answers…</p></section></main><script>
(()=>{'use strict';const q=new URLSearchParams(location.search),machineId=q.get('machineId')||'',reportId=q.get('reportId')||'',techToken=localStorage.getItem('belm_tech_token')||'',adminToken=localStorage.getItem('belm_admin_token')||'',token=techToken||adminToken,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),fmt=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?String(v||'—'):[String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),String(d.getFullYear()).slice(-2)].join('.')},api=async u=>{const r=await fetch(u,{cache:'no-store',headers:{Authorization:`Bearer ${token}`}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not load checked report.');return d};
if(!token){location.replace('/login');return}if(adminToken&&!techToken){document.getElementById('report-owner').textContent='BELM COORDINATOR · CHECKED REPORT'}if(!machineId||!reportId){document.getElementById('items').innerHTML='<p class="error">Invalid checked report link.</p>';return}
document.getElementById('pdf').onclick=async e=>{const b=e.currentTarget,o=b.textContent;b.disabled=true;b.textContent='Preparing…';try{const r=await fetch(`/api/checklist-reports/${encodeURIComponent(reportId)}/pdf`,{headers:{Authorization:`Bearer ${token}`}});if(!r.ok)throw new Error('Could not download PDF.');const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`BELM-Checklist-${reportId}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(x){alert(x.message)}finally{b.disabled=false;b.textContent=o}};
api(`/api/checklist-reports/machine/${encodeURIComponent(machineId)}`).then(rows=>{const r=(Array.isArray(rows)?rows:[]).find(x=>String(x.id)===reportId);if(!r)throw new Error('Checked report was not found.');const machine=[r.machineBrand||r.brand,r.machineModel||r.model].filter(Boolean).join(' ')||'Machine';document.getElementById('title').textContent=r.templateName||'Checklist Report';document.getElementById('sub').textContent=`${machine} · ${r.overallStatus||'CHECKED'}`;document.getElementById('number').textContent=r.checklistNo||reportId;document.getElementById('date').textContent=`${fmt(r.createdAt||r.created_at)} · CHECKED`;document.getElementById('tech').textContent=r.filledBy||r.filled_by||'Not recorded';document.getElementById('hours').textContent=r.hourMeterReading??r.hour_meter_reading??'—';const answers=Array.isArray(r.answers)?r.answers:[];const display=r.displayPhotoUrl||r.display_photo_url||'';document.getElementById('items').innerHTML=(display?`<article class="item"><div><small>Machine Display</small><strong>Display photo recorded during check-up</strong></div><img class="photo" src="${esc(display)}" alt="Machine display photo"></article>`:'')+(answers.length?answers.map((a,i)=>{const level=String(a.safetyLevel||a.safety_level||'NONE').toLowerCase(),photo=a.photoUrl||a.photo_url||'',rawValue=String(a.value??'').trim(),value=rawValue||'Not recorded',label=String(a.label||'Checklist item').trim(),plain=String(value).trim(),abnormal=['low','contaminated','low & contaminated','overfilled','high','leaking','leak','damaged','worn','broken','loose','not working','failed','dirty','blocked','overheating','critical','no'].includes(plain.toLowerCase()),issue=abnormal?`${label.replace(/[:?.]+$/,'')} ${plain.toLowerCase()}`:'';return`<article class="item ${esc(level)}"><div><small>Item ${i+1}</small><strong>${esc(label)}</strong>${issue?`<small class="issue-text">${esc(issue)}</small>`:''}${a.note?`<small>Issue: ${esc(a.note)}</small>`:''}</div><div class="answer"><small>${esc(String(level).toUpperCase())}</small><b>${esc(String(value).startsWith('data:image/')?'Photo':value)}</b></div>${photo?`<img class="photo" src="${esc(photo)}" alt="${esc(a.label||'Checklist photo')}">`:''}</article>`}).join(''):'<p class="empty">No checklist answers were saved.</p>')}).catch(e=>document.getElementById('items').innerHTML=`<p class="error">${esc(e.message)}</p>`)})();
</script></body></html>
