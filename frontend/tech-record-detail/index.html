<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BELM Detailed Report</title><meta name="theme-color" content="#071426"><style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#fff;font-family:Inter,Arial,sans-serif}.shell{width:min(980px,calc(100% - 24px));margin:18px auto 50px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px;border:1px solid #174160;border-radius:16px;background:#03162a}.head small{color:#18a9f4;font-weight:900}.head h1{margin:5px 0;font-size:clamp(20px,4vw,30px)}.head p{margin:0;color:#9fb0c8}.back,.tools button{padding:10px 13px;border:1px solid #1684ff;border-radius:9px;background:#0d4fa3;color:#fff;font-weight:900;cursor:pointer}.back{background:#04172a;border-color:#315675}.tools{display:flex;justify-content:flex-end;gap:8px;margin:14px 0}.tools button:last-child{border-color:#12b83f;background:#087b43}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{padding:15px;border:1px solid #174160;border-radius:13px;background:#04172a}.field.wide{grid-column:1/-1}.field span{display:block;color:#8fa6bd;font-size:10px;font-weight:850;text-transform:uppercase}.field b,.field p{display:block;margin:6px 0 0;line-height:1.5;white-space:pre-wrap}.status{color:#65e489!important}.error{padding:22px;border:1px solid #174160;border-radius:12px;background:#04172a;color:#ff9a9a}@media(max-width:600px){.head{flex-direction:column-reverse}.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.tools{display:grid;grid-template-columns:repeat(3,1fr)}.tools button{font-size:10px;padding:10px 5px}}@media print{body{background:#fff;color:#111}.shell{width:100%;margin:0}.back,.tools{display:none}.head,.field{background:#fff;color:#111;border-color:#bbb}.head p,.field span{color:#444}.status{color:#087b43!important}}
</style></head><body><main class="shell"><header class="head"><div><small>BELM TECHNICIAN · DETAILED REPORT</small><h1 id="title">Loading report…</h1><p id="sub">Please wait</p></div><button class="back" onclick="history.back()">← Back</button></header><nav class="tools"><button onclick="print()">Print</button><button id="pdf">Download PDF</button><button id="csv">CSV File</button></nav><section id="fields" class="grid"><p>Loading report details…</p></section></main><script>
(()=>{'use strict';const q=new URLSearchParams(location.search),machineId=q.get('machineId')||'',reportId=q.get('reportId')||'',category=q.get('category')||'',token=localStorage.getItem('belm_tech_token')||'',names={operator:'Operator Report',fuel:'Fuel Report','job-cards':'Job Card Report',maintenance:'Maintenance Report'},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),fmt=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):[String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),String(d.getFullYear()).slice(-2)].join('.')},field=(label,value,wide=false)=>`<article class="field ${wide?'wide':''}"><span>${esc(label)}</span>${wide?`<p>${esc(value??'—')}</p>`:`<b>${esc(value??'—')}</b>`}</article>`,api=async u=>{const r= = await fetch(`/api/checklist-reports/technician-general?machineIdId=${encodeURIComponent(machineId)}&category=${encodeURIComponent(category)}&reportId=${encodeURIComponent(reportId)}`,{cache:'no-store',headers:{Authorization:`Bearer ${token}`}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not load report.');return d},file=async(format,b)=>{const old=b.textContent;b.disabled=true;b.textContent='Preparing…';try{const r==await fetch(`/api/checklist-reports/technician-general/${format}?machineIdId=${encodeURIComponent(machineId)}&category=${encodeURIComponent(category)}&reportId=${encodeURIComponent(reportId)}`,{headers:{Authorization:`Bearer ${token}`}});if(!r.ok)throw new Error('Could not download report.');const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`BELM-${names[category]}-${reportId}.${format}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}finally{b.disabled=false;b.textContent=old}};
if(!token){location.replace('/tech');return}if(!machineId||!reportId||!names[category]){document.getElementById('fields').innerHTML='<p class="error">Invalid detailed report link.</p>';return}document.getElementById('title').textContent=names[category];document.getElementById('pdf').onclick=e=>file('pdf',e.currentTarget).catch(x=>alert(x.message));document.getElementById('csv').onclick=e=>file('csv',e.currentTarget).catch(x=>alert(x.message));
api().then(data=>{const map={operator:data.operatorReports||[],fuel:data.fuelReports||[],'job-cards':data.jobCards||[],maintenance:data.maintenanceReports||[]},r=map[category]?.[0];if(!r)throw new Error('This report record was not found.');const machine=[r.machine,r.fleetNumber].filter(Boolean).join(' · ');document.getElementById('title').textContent=`${machine||'Machine'} — ${names[category]}`;let html='';if(category==='operator')html=field('Date Checked',fmt(r.createdAt)+' · CHECKED')+field('Status',r.status)+field('Operator',r.operatorName)+field('Contact',r.operatorContact||'Not recorded')+field('Reported Issue',r.message,true)+(r.resolvedAt?field('Resolved Date',fmt(r.resolvedAt)):'' );else if(category==='fuel')html=field('Date Checked',fmt(r.date||r.createdAt)+' · CHECKED')+field('Litres',r.litres)+field('Price per Litre','TZS '+Number(r.unitPrice||0).toLocaleString('en-TZ'))+field('Total Cost','TZS '+Number(r.cost||0).toLocaleString('en-TZ'))+field('Recorded By',r.loggedBy)+field('Description',r.description||'Fuel',true);else if(category==='job-cards')html=field('Date Checked',fmt(r.completedAt||r.createdAt)+' · CHECKED')+field('Job Card Number',r.jobCardNo)+field('Status',r.status)+field('Priority',r.priority)+field('Technician',r.technicianName)+field('Repeated Issue',r.repeatIssue?'YES':'NO')+field('Title',r.title,true)+field('Fault Description',r.faultDescription,true)+field('Diagnosis',r.diagnosis||'Not recorded',true)+field('Work Done',r.workDone||'Not recorded',true)+field('Test Result',r.testResult||'Not recorded',true)+field('Completion Note',r.completionNote||'Not recorded',true);else html=field('Date Checked',fmt(r.date)+' · CHECKED')+field('Service Type',r.serviceType)+field('Hour Meter',r.hourMeterReading??'—')+field('Recorded By',r.recordedBy)+field('Work / Requirements Completed',r.requirementsDone||'Not recorded',true);document.getElementById('sub').textContent=`${names[category]} · ${fmt(r.completedAt||r.date||r.createdAt)}`;document.getElementById('fields').innerHTML=html}).catch(e=>document.getElementById('fields').innerHTML=`<p class="error">${esc(e.message)}</p>`)})();
</script></body></html>
