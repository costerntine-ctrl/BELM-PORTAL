<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BELM Machine Report</title><meta name="theme-color" content="#071426">
<style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#fff;font-family:Inter,Arial,sans-serif}.shell{width:min(1000px,calc(100% - 24px));margin:18px auto 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;border:1px solid #174160;border-radius:16px;background:#03162a}.top small{color:#18a9f4;font-weight:900}.top h1{margin:5px 0 0;font-size:clamp(20px,4vw,30px)}button{cursor:pointer}.back{padding:10px 14px;border:1px solid #315675;border-radius:10px;background:#04172a;color:#fff;font-weight:850}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.summary div{padding:13px;border:1px solid #174160;border-radius:12px;background:#04172a}.summary span{display:block;color:#8fa6bd;font-size:10px;text-transform:uppercase}.summary b{display:block;margin-top:5px}.tools{display:flex;justify-content:flex-end;gap:8px;margin:14px 0}.tools button{padding:10px 13px;border:1px solid #1684ff;border-radius:9px;background:#0d4fa3;color:#fff;font-weight:900}.tools button:last-child{border-color:#12b83f;background:#087b43}.list{display:grid;gap:11px}.row{display:grid;gap:6px;padding:15px;border:1px solid #174160;border-radius:13px;background:#04172a}.row b{font-size:14px}.date{color:#65e489;font-size:11px;font-weight:950}.row small{color:#aebdce;line-height:1.45}.empty,.error{padding:24px;border:1px solid #174160;border-radius:13px;background:#04172a;color:#aebdce}.error{color:#ff9a9a}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column-reverse}.summary{grid-template-columns:1fr}.tools{display:grid;grid-template-columns:repeat(3,1fr)}.tools button{padding:10px 5px;font-size:10px}}@media print{body{background:#fff;color:#111}.shell{width:100%;margin:0}.back,.tools{display:none}.top,.summary div,.row{border-color:#bbb;background:#fff;color:#111}.top small,.date{color:#087b43}.row small,.summary span{color:#444}}
</style></head><body><main class="shell"><header class="top"><div><small>BELM TECHNICIAN · MACHINE REPORT</small><h1 id="title">Loading report…</h1></div><button class="back" onclick="history.back()">← Back</button></header><section class="summary"><div><span>Machine</span><b id="machine">—</b></div><div><span>Report Type</span><b id="type">—</b></div><div><span>Records</span><b id="count">0</b></div></section><nav class="tools"><button id="print">Print</button><button id="pdf">Download PDF</button><button id="csv">CSV File</button></nav><section id="list" class="list"><p class="empty">Loading report records…</p></section></main>
<script>
(()=>{'use strict';const q=new URLSearchParams(location.search),machineId=q.get('machineId')||'',category=q.get('category')||'checklists',token=localStorage.getItem('belm_tech_token')||'',names={checklists:'Checklist Report',operator:'Operator Report',fuel:'Fuel Report','job-cards':'Job Card Reports',maintenance:'Maintenance Report'},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),date=v=>{if(!v)return'—';const d=new Date(v);if(Number.isNaN(d.getTime())){const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0].slice(-2)}`:String(v)}return [String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),String(d.getFullYear()).slice(-2)].join('.')},api=async u=>{const r=await fetch(u,{cache:'no-store',headers:{Authorization:`Bearer ${token}`}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not load report.');return d},file=async(format,button)=>{const old=button.textContent;button.disabled=true;button.textContent='Preparing…';try{const r=await fetch(`/api/checklist-reports/technician-general/${format}?category=${encodeURIComponent(category)}&machineId=${encodeURIComponent(machineId)}`,{headers:{Authorization:`Bearer ${token}`}});if(!r.ok)throw new Error('Could not download report.');const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`BELM-${names[category]||'Report'}.${format}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}finally{button.disabled=false;button.textContent=old}};
if(!token){location.replace('/tech');return}if(!machineId||!names[category]){document.getElementById('list').innerHTML='<p class="error">Invalid machine report link.</p>';return}
document.getElementById('type').textContent=names[category];document.getElementById('title').textContent=names[category];document.getElementById('print').onclick=()=>print();document.getElementById('pdf').onclick=e=>file('pdf',e.currentTarget).catch(x=>alert(x.message));document.getElementById('csv').onclick=e=>file('csv',e.currentTarget).catch(x=>alert(x.message));
api(`/api/checklist-reports/technician-general?machineId=${encodeURIComponent(machineId)}`).then(data=>{const map={checklists:data.checklists||[],operator:data.operatorReports||[],fuel:data.fuelReports||[],'job-cards':data.jobCards||[],maintenance:data.maintenanceReports||[]},rows=map[category]||[],m=data.machines?.[0]||{};document.getElementById('machine').textContent=[m.label,m.fleetNumber].filter(Boolean).join(' · ')||'Machine';document.getElementById('title').textContent=`${m.label||'Machine'} — ${names[category]}`;document.getElementById('count').textContent=rows.length;document.getElementById('list').innerHTML=rows.length?rows.map(r=>{let title='',detail='',when=r.createdAt||r.date;if(category==='checklists'){title=r.templateName||'Checklist Report';detail=`${r.status||'GREEN'} · Hour meter: ${r.hourMeterReading??'—'} · ${r.filledBy||'Not recorded'}`}else if(category==='operator'){title=r.operatorName||'Operator';detail=`${r.status||'OPEN'} · ${r.message||'No message'}`}else if(category==='fuel'){title=`${r.litres||0} Litres · TZS ${Number(r.cost||0).toLocaleString('en-TZ')}`;detail=`${r.description||'Fuel'} · By ${r.loggedBy||'Not recorded'}`}else if(category==='job-cards'){title=`${r.jobCardNo||'Job Card'} · ${r.title||'Maintenance'}`;detail=`${r.status||'OPEN'} · ${r.faultDescription||''}`;when=r.completedAt||r.createdAt}else{title=r.serviceType||'Maintenance';detail=`Hour meter: ${r.hourMeterReading??'—'} · ${r.recordedBy||'Not recorded'}`;when=r.date}return`<article class="row"><b>${esc(title)}</b><span class="date">${esc(date(when))} · CHECKED</span><small>${esc(detail)}</small></article>`}).join(''):'<p class="empty">No report records found.</p>'}).catch(e=>document.getElementById('list').innerHTML=`<p class="error">${esc(e.message)}</p>`);
})();
</script></body></html>
