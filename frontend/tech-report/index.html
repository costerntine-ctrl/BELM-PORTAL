<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BELM Machine Report</title><meta name="theme-color" content="#071426">
<style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#fff;font-family:Inter,Arial,sans-serif}.shell{width:min(1000px,calc(100% - 24px));margin:18px auto 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;border:1px solid #174160;border-radius:16px;background:#03162a}.top small{color:#18a9f4;font-weight:900}.top h1{margin:5px 0 0;font-size:clamp(20px,4vw,30px)}button{cursor:pointer}.back{padding:10px 14px;border:1px solid #315675;border-radius:10px;background:#04172a;color:#fff;font-weight:850}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.summary div{padding:13px;border:1px solid #174160;border-radius:12px;background:#04172a}.summary span{display:block;color:#8fa6bd;font-size:10px;text-transform:uppercase}.summary b{display:block;margin-top:5px}.tools{display:flex;justify-content:flex-end;gap:8px;margin:14px 0}.tools button{padding:10px 13px;border:1px solid #1684ff;border-radius:9px;background:#0d4fa3;color:#fff;font-weight:900}.tools button:last-child{border-color:#12b83f;background:#087b43}.list{display:grid;gap:11px}.row{display:grid;gap:6px;padding:15px;border:1px solid #174160;border-radius:13px;background:#04172a}.row b{font-size:14px}.date{color:#65e489;font-size:11px;font-weight:950}.row small{color:#aebdce;line-height:1.45}.row-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:7px}.row-actions button{padding:9px 6px;border:1px solid #1684ff;border-radius:8px;background:#0d4fa3;color:#fff;font-size:10px;font-weight:900}.row-actions button:last-child{border-color:#12b83f;background:#087b43}.empty,.error{padding:24px;border:1px solid #174160;border-radius:13px;background:#04172a;color:#aebdce}.error{color:#ff9a9a}@media(max-width:600px){.row-actions{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column-reverse}.summary{grid-template-columns:1fr}.tools{display:grid;grid-template-columns:repeat(3,1fr)}.tools button{padding:10px 5px;font-size:10px}}@media print{body{background:#fff;color:#111}.shell{width:100%;margin:0}.back,.tools,.row-actions{display:none}.top,.summary div,.row{border-color:#bbb;background:#fff;color:#111}.top small,.date{color:#087b43}.row small,.summary span{color:#444}}
</style></head><body><main class="shell"><header class="top"><div><small>BELM TECHNICIAN · MACHINE REPORT</small><h1 id="title">Loading report…</h1></div><button class="back" onclick="history.back()">← Back</button></header><section class="summary"><div><span>Machine</span><b id="machine">—</b></div><div><span>Report Type</span><b id="type">—</b></div><div><span>Records</span><b id="count">0</b></div><div><span>Period</span><b id="period">All time</b></div></section><section id="list" class="list"><p class="empty">Loading report records…</p></section></main>
<script>
(()=>{'use strict';const q=new URLSearchParams(location.search),machineId=q.get('machineId')||'',category=q.get('category')||'checklists',from=q.get('from')||'',to=q.get('to')||'',token=localStorage.getItem('belm_tech_token')||'',names={checklists:'Checklist Report',operator:'Operator Report',fuel:'Fuel Report','job-cards':'Job Card Reports',maintenance:'Maintenance Report'},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),date=v=>{if(!v)return'—';const d=new Date(v);if(Number.isNaN(d.getTime())){const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0].slice(-2)}`:String(v)}return [String(d.getDate()).padStart(2,'0'),String(d.getMonth()+1).padStart(2,'0'),String(d.getFullYear()).slice(-2)].join('.')},api=async u=>{const r=await fetch(u,{cache:'no-store',headers:{Authorization:`Bearer ${token}`}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not load report.');return d},file=async(format,button,recordId,printMode=false)=>{const old=button.textContent;button.disabled=true;button.textContent='Preparing…';try{const r=await fetch(`/api/checklist-reports/technician-general/${format}?category=${encodeURIComponent(category)}&machineId=${encodeURIComponent(machineId)}&reportId=${encodeURIComponent(recordId)}`,{headers:{Authorization:`Bearer ${token}`}});if(!r.ok)throw new Error('Could not prepare this report.');const blob=await r.blob(),href=URL.createObjectURL(blob);if(printMode){const w=window.open(href,'_blank');if(!w)throw new Error('Allow pop-ups to print this report.');setTimeout(()=>{try{w.print()}catch(_){}},900)}else{const a=document.createElement('a');a.href=href;a.download=`BELM-${names[category]||'Report'}-${recordId}.${format}`;a.click()}setTimeout(()=>URL.revokeObjectURL(href),60000)}finally{button.disabled=false;button.textContent=old}};
if(!token){location.replace('/tech');return}if(!machineId||!names[category]){document.getElementById('list').innerHTML='<p class="error">Invalid machine report link.</p>';return}
document.getElementById('type').textContent=names[category];document.getElementById('title').textContent=names[category];
document.getElementById('period').textContent=from||to?`${from?date(from):'Start'} → ${to?date(to):'Today'}`:'All time';const range=new URLSearchParams({machineId});if(from)range.set('from',from);if(to)range.set('to',to);api(`/api/checklist-reports/technician-general?${range}`).then(data=>{const map={checklists:data.checklists||[],operator:data.operatorReports||[],fuel:data.fuelReports||[],'job-cards':data.jobCards||[],maintenance:data.maintenanceReports||[]},rows=map[category]||[],m=data.machines?.[0]||{};document.getElementById('machine').textContent=[m.label,m.fleetNumber].filter(Boolean).join(' · ')||'Machine';document.getElementById('title').textContent=`${m.label||'Machine'} — ${names[category]}`;document.getElementById('count').textContent=rows.length;document.getElementById('list').innerHTML=rows.length?rows.map(r=>{let title='',detail='',when=r.createdAt||r.date;if(category==='checklists'){title=r.templateName||'Checklist Report';detail=`${r.status||'GREEN'} · Hour meter: ${r.hourMeterReading??'—'} · ${r.filledBy||'Not recorded'}`}else if(category==='operator'){title=r.operatorName||'Operator';detail=`${r.status||'OPEN'} · ${r.message||'No message'}`}else if(category==='fuel'){title=`${r.litres||0} Litres · TZS ${Number(r.cost||0).toLocaleString('en-TZ')}`;detail=`${r.description||'Fuel'} · By ${r.loggedBy||'Not recorded'}`}else if(category==='job-cards'){title=`${r.jobCardNo||'Job Card'} · ${r.title||'Maintenance'}`;detail=`${r.status||'OPEN'} · ${r.faultDescription||''}`;when=r.completedAt||r.createdAt}else{title=r.serviceType||'Maintenance';detail=`Hour meter: ${r.hourMeterReading??'—'} · ${r.recordedBy||'Not recorded'}`;when=r.date}const id=r.id||r.reportId||'';return`<article class="row"><b>${esc(title)}</b><span class="date">${esc(date(when))} · CHECKED</span><small>${esc(detail)}</small><div class="row-actions"><button type="button" data-row-detail="${esc(id)}">${category==='checklists'?'View Checked Report':category==='operator'?'View Operator Report':category==='fuel'?'View Fuel Report':category==='job-cards'?'View Job Card Report':'View Maintenance Report'}</button><button type="button" data-row-print="${esc(id)}">Print</button><button type="button" data-row-pdf="${esc(id)}">Download PDF</button><button type="button" data-row-csv="${esc(id)}">CSV File</button></div></article>`}).join(''):'<p class="empty">No report records found.</p>';const list=document.getElementById('list');list.querySelectorAll('[data-row-detail]').forEach(b=>b.onclick=()=>{const path=category==='checklists'?'/tech-checked-report/':'/tech-record-detail/';location.href=`${path}?machineId=${encodeURIComponent(machineId)}&category=${encodeURIComponent(category)}&reportId=${encodeURIComponent(b.dataset.rowDetail)}&v=665`});list.querySelectorAll('[data-row-print]').forEach(b=>b.onclick=()=>file('pdf',b,b.dataset.rowPrint,true).catch(x=>alert(x.message)));list.querySelectorAll('[data-row-pdf]').forEach(b=>b.onclick=()=>file('pdf',b,b.dataset.rowPdf).catch(x=>alert(x.message)));list.querySelectorAll('[data-row-csv]').forEach(b=>b.onclick=()=>file('csv',b,b.dataset.rowCsv).catch(x=>alert(x.message)))}).catch(e=>document.getElementById('list').innerHTML=`<p class="error">${esc(e.message)}</p>`);
})();
</script></body></html>
