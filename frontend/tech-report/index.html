button.disabled=false;button.textContent=old}},statusInfo=v=>{const s=String(v||'').toUpperCase();if(s.includes('RED')||s.includes('CRITICAL'))return{cls:'red',label:"Red — Don't operate"};if(s.includes('YELLOW')||s.includes('WARNING')||s.includes('ATTENTION'))return{cls:'yellow',label:'Yellow — Attention'};if(s.includes('GREEN')||s.includes('NORMAL')||s.includes('OK'))return{cls:'green',label:'Green — Normal'};return{cls:'unknown',label:s||'Not checked'}};

if(category==='checklists'){
  document.getElementById('list').innerHTML=rows.length?rows.map(r=>{const id=r.id||r.reportId||'',st=statusInfo(r.status),when=r.createdAt||r.date,meta=[date(when),time(when),`Hour meter: ${r.hourMeterReading??'—'}`,r.filledBy||'Not recorded'].filter(Boolean).join(' · ');return`<article class="checklist-row"><div class="checklist-main"><b>${esc(r.templateName||'Checklist Report')}</b><small>${esc(meta)}</small></div><span class="status-badge ${st.cls}">${esc(st.label)}</span><button class="checklist-action checklist-view" type="button" data-row-detail="${esc(id)}">View Report</button><button class="checklist-action checklist-download" type="button" data-row-pdf="${esc(id)}">Download Report</button></article>`}).join(''):'<p class="empty">No checklist report records found.</p>';
  const list=document.getElementById('list');list.querySelectorAll('[data-row-detail]').forEach(b=>b.onclick=()=>{location.href=`/tech-checked-report/?machineId=${encodeURIComponent(machineId)}&category=checklists&reportId=${encodeURIComponent(b.dataset.rowDetail)}&v=750`});list.querySelectorAll('[data-row-pdf]').forEach(b=>b.onclick=()=>file('pdf',b,b.dataset.rowPdf).catch(x=>alert(x.message)));return;
