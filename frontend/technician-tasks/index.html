<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tasks — BELM Technician</title>
  <link rel="stylesheet" href="/technician-tasks/tasks.css">
</head>
<body>
  <header><a class="brand" href="/tech"><span class="mark">B</span><span><b>BELM Technician</b><small>Assigned Work Tasks</small></span></a><nav><a href="/tech">← Checklist app</a><button id="logoutButton" type="button">Log out</button></nav></header>
  <main>
    <section class="heading"><div><p>FIELD WORK PLAN</p><h1>My tasks</h1><span>Tasks assigned to your Technician account by BELM administration.</span></div><button id="refreshButton" type="button">Refresh</button></section>
    <div id="alertBox" class="alert hidden"></div>
    <section class="tabs"><button class="active" data-filter="PENDING">Pending</button><button data-filter="DONE">Completed</button><button data-filter="">All</button></section>
    <section id="taskList" class="task-list"><div class="loading">Loading tasks…</div></section>
  </main>
  <script src="/technician-tasks/tasks.js"></script>
</body>
</html>
