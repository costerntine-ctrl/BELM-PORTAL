services:
  - type: web
    name: belm-portal
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    domains:
      - portal.belmgeneraltech.co.tz
    envVars:
      - key: APP_ENV
        value: production
      - key: PORTAL_URL
        value: https://portal.belmgeneraltech.co.tz
      - key: ALLOWED_ORIGINS
        value: https://belmgeneraltech.co.tz,https://www.belmgeneraltech.co.tz,https://portal.belmgeneraltech.co.tz
      - key: DATABASE_URL
        fromDatabase:
          name: belm-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: belm-portal-db
    plan: free
    region: frankfurt
    databaseName: belm_portal
    user: belm_portal
    postgresMajorVersion: "17"
